name: Auto Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "hostinger-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check if Hostinger FTP Secrets are Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_SERVER }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Hostinger FTP credentials (HOSTINGER_FTP_SERVER) not set yet. Skipping FTP upload."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Hostinger via FTP
        if: steps.check_secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./dist/
          dangerous-clean-slate: false
