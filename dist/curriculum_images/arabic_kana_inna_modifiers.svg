<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#15203b"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .sec-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
    .header-badge { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .member-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 12px; font-weight: bold; fill: #fbbf24; text-anchor: end; }
    .text-body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .ex-q { font-family: 'Cairo', 'Amiri', 'Traditional Arabic', serif; font-size: 14px; font-weight: bold; fill: #34d399; }
    .parse-lbl { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11px; fill: #93c5fd; }
  </style>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="944" height="624" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="25" y="18" width="910" height="62" rx="10" fill="#132338" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="480" y="44" class="title-main">مخطط النواسخ المعتمد: كَانَ وأخواتها (أفعال ناسخة) مقابل إِنَّ وأخواتها (حروف ناسخة)</text>
  <text x="480" y="66" class="subtitle">قواعد اللغة العربية • أثر النواسخ على المبتدأ والخبر، المعاني البلاغية والدلالية، والشواهد التطبيقية المضبوطة</text>

  <!-- Section: Side-by-Side In-depth Comparison -->
  <g transform="translate(25, 92)">
    <!-- Right Card: Kana & Sisters (Af'al Nasikha) -->
    <g transform="translate(470, 0)">
      <rect width="440" height="420" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="15" y="12" width="410" height="34" rx="6" fill="#0284c7"/>
      <text x="220" y="34" class="header-badge">كَانَ وَأَخَوَاتُهَا (أَفْعَالٌ نَاسِخَةٌ نَاقِصَةٌ)</text>

      <!-- Operation Rule Box -->
      <rect x="15" y="56" width="410" height="45" rx="6" fill="#0c1a2e" stroke="#0284c7" stroke-width="0.8"/>
      <text x="410" y="76" class="text-body" text-anchor="end" font-weight="bold" fill="#38bdf8">عَمَلُهَا فِي الْجُمْلَةِ الاسْمِيَّةِ:</text>
      <text x="410" y="94" class="text-body" text-anchor="end">تَدْخُلُ عَلَى الْمُبْتَدَأِ <tspan fill="#4ade80" font-weight="bold">فَتَرْفَعُهُ اسْماً لَهَا</tspan>، وَتَنْصِبُ الْخَبَرَ <tspan fill="#f87171" font-weight="bold">خَبَراً لَهَا</tspan>.</text>

      <!-- Members & Meanings -->
      <rect x="15" y="110" width="410" height="150" rx="6" fill="#081426" stroke="#1e3a5f" stroke-width="0.8"/>
      <text x="410" y="130" class="member-title">أَخَوَاتُ كَانَ وَدَلاَلاَتُهَا:</text>
      <text x="410" y="152" class="text-body" text-anchor="end">• <tspan fill="#fbbf24">كَانَ:</tspan> التوقيت في الماضي • <tspan fill="#fbbf24">أَصْبَحَ:</tspan> التوقيت في الصباح</text>
      <text x="410" y="174" class="text-body" text-anchor="end">• <tspan fill="#fbbf24">أَضْحَى:</tspan> وقت الضحى • <tspan fill="#fbbf24">أَمْسَى:</tspan> وقت المساء</text>
      <text x="410" y="196" class="text-body" text-anchor="end">• <tspan fill="#fbbf24">بَاتَ:</tspan> وقت الليل • <tspan fill="#fbbf24">ظَلَّ:</tspan> الاستمرار في النهار</text>
      <text x="410" y="218" class="text-body" text-anchor="end">• <tspan fill="#fbbf24">صَارَ:</tspan> التحول والانتقال • <tspan fill="#fbbf24">لَيْسَ:</tspan> النفي الصريح</text>
      <text x="410" y="240" class="text-body" text-anchor="end">• <tspan fill="#fbbf24">مَا زَالَ، مَا بَرِحَ، مَا فَتِئَ، مَا انْفَكَّ:</tspan> ملازمة واستمرار</text>

      <!-- Example & Parsing -->
      <rect x="15" y="270" width="410" height="135" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
      <text x="410" y="292" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">شَاهِدٌ إِعْرَابِيٌّ مُفَصَّلٌ:</text>
      <text x="410" y="322" class="ex-q" text-anchor="end">«كَانَ الْجَوُّ صَحْواً وَالْمَطَرُ هَاطِلاً»</text>
      <text x="410" y="350" class="parse-lbl" text-anchor="end">• كَانَ: فعل ماضٍ ناسخ مبني على الفتح.</text>
      <text x="410" y="370" class="parse-lbl" text-anchor="end">• الجَوُّ: <tspan fill="#4ade80" font-weight="bold">اسم كان مرفوع</tspan> وعلامة رفعه الضمة الظاهرة.</text>
      <text x="410" y="390" class="parse-lbl" text-anchor="end">• صَحْواً: <tspan fill="#f87171" font-weight="bold">خبر كان منصوب</tspan> وعلامة نصبه الفتحة الظاهرة.</text>
    </g>

    <!-- Left Card: Inna & Sisters (Huroof Nasikha) -->
    <g transform="translate(0, 0)">
      <rect width="445" height="420" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="15" y="12" width="415" height="34" rx="6" fill="#be123c"/>
      <text x="222" y="34" class="header-badge">إِنَّ وَأَخَوَاتُهَا (حُرُوفٌ نَاسِخَةٌ مُشَبَّهَةٌ بِالْفِعْلِ)</text>

      <!-- Operation Rule Box -->
      <rect x="15" y="56" width="415" height="45" rx="6" fill="#2d131a" stroke="#be123c" stroke-width="0.8"/>
      <text x="415" y="76" class="text-body" text-anchor="end" font-weight="bold" fill="#fb7185">عَمَلُهَا فِي الْجُمْلَةِ الاسْمِيَّةِ:</text>
      <text x="415" y="94" class="text-body" text-anchor="end">تَدْخُلُ عَلَى الْمُبْتَدَأِ <tspan fill="#f87171" font-weight="bold">فَتَنْصِبُهُ اسْماً لَهَا</tspan>، وَتَرْفَعُ الْخَبَرَ <tspan fill="#4ade80" font-weight="bold">خَبَراً لَهَا</tspan>.</text>

      <!-- Members & Meanings -->
      <rect x="15" y="110" width="415" height="150" rx="6" fill="#1c0a10" stroke="#881337" stroke-width="0.8"/>
      <text x="415" y="130" class="member-title" fill="#fb7185">أَخَوَاتُ إِنَّ وَدَلاَلاَتُهَا:</text>
      <text x="415" y="152" class="text-body" text-anchor="end">• <tspan fill="#facc15">إِنَّ / أَنَّ:</tspan> التوكيد وتحقيق النسبة وإزالة الشك</text>
      <text x="415" y="174" class="text-body" text-anchor="end">• <tspan fill="#facc15">كَأَنَّ:</tspan> التشبيه والمقاربة</text>
      <text x="415" y="196" class="text-body" text-anchor="end">• <tspan fill="#facc15">لَكِنَّ:</tspan> الاستدراك ومنع توهم الخطأ</text>
      <text x="415" y="218" class="text-body" text-anchor="end">• <tspan fill="#facc15">لَيْتَ:</tspan> التمني لِما يستحيل أو يعسر حصوله</text>
      <text x="415" y="240" class="text-body" text-anchor="end">• <tspan fill="#facc15">لَعَلَّ:</tspan> الترجي لِما يرجى وقربه أو الإشفاق</text>

      <!-- Example & Parsing -->
      <rect x="15" y="270" width="415" height="135" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="415" y="292" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fb7185" text-anchor="end">شَاهِدٌ إِعْرَابِيٌّ مُفَصَّلٌ:</text>
      <text x="415" y="322" class="ex-q" text-anchor="end">«إِنَّ العِلْمَ نُورٌ يَهْدِي الْعُقُولَ»</text>
      <text x="415" y="350" class="parse-lbl" text-anchor="end">• إِنَّ: حرف توكيد ونصب مبني على الفتح لا محل له.</text>
      <text x="415" y="370" class="parse-lbl" text-anchor="end">• العِلْمَ: <tspan fill="#f87171" font-weight="bold">اسم إن منصوب</tspan> وعلامة نصبه الفتحة الظاهرة.</text>
      <text x="415" y="390" class="parse-lbl" text-anchor="end">• نُورٌ: <tspan fill="#4ade80" font-weight="bold">خبر إن مرفوع</tspan> وعلامة رفعه الضمة الظاهرة.</text>
    </g>
  </g>

  <!-- Bottom Golden Rule of Thumb Box -->
  <g transform="translate(25, 525)">
    <rect width="910" height="95" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="455" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" fill="#facc15" text-anchor="middle">
      القَاعِدَةُ الذَّهَبِيَّةُ لِلْحِفْظِ السَّرِيعِ وَعَدَمِ الخَلْطِ بَيْنَ النَّاسِخَيْنِ:
    </text>
    <text x="455" y="54" font-family="'Cairo', sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">
      كَانَ (فعل) ➔ <tspan fill="#4ade80" font-weight="bold">تَرْفَعُ</tspan> الْمُبْتَدَأَ وَ <tspan fill="#f87171" font-weight="bold">تَنْصِبُ</tspan> الْخَبَرَ  |  إِنَّ (حرف) ➔ <tspan fill="#f87171" font-weight="bold">تَنْصِبُ</tspan> الْمُبْتَدَأَ وَ <tspan fill="#4ade80" font-weight="bold">تَرْفَعُ</tspan> الْخَبَرَ
    </text>
    <text x="455" y="78" font-family="'Cairo', sans-serif" font-size="11.5" fill="#93c5fd" text-anchor="middle">
      تذكر دائماً: كَانَ ترفع أولاً ثم تنصب، بينما إِنَّ تنصب أولاً ثم ترفع (عكس بعضهما تماماً في العمل).
    </text>
  </g>
</svg>
