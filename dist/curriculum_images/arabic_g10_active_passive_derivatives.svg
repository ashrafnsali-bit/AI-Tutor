<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a111e"/>
      <stop offset="50%" stop-color="#111d33"/>
      <stop offset="100%" stop-color="#1e1838"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .sec-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
    .deriv-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .badge-work { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11px; font-weight: bold; fill: #facc15; }
    .text-body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .ex-q { font-family: 'Cairo', 'Amiri', 'Traditional Arabic', serif; font-size: 12.5px; font-weight: bold; fill: #34d399; }
    .ex-parse { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 10.5px; fill: #93c5fd; }
  </style>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="944" height="624" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="25" y="20" width="910" height="65" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="480" y="47" class="title-main">مخطط إعمال المشتقات العاملة عمل فعلها: اسم الفاعل • صيغ المبالغة • اسم المفعول</text>
  <text x="480" y="69" class="subtitle">الصف الأول الثانوي (النحو التراكمي لسانٌ عربيٌّ مبين EG) • قواعد الصياغة، شروط الإعمال، وإعراب المعمول</text>

  <!-- Section 1: The Three Working Derivatives (Siyagh & Ma'mool) -->
  <g transform="translate(25, 98)">
    <rect width="910" height="195" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="455" y="24" class="sec-title">١. الْمُشْتَقَّاتُ الثَّلاَثَةُ: صِيَاغَتُهَا وَعَمَلُ كُلٍّ مِنْهَا فِي مَعْمُولِهِ</text>

    <!-- Deriv 1: Ism al-Fa'il -->
    <g transform="translate(615, 38)">
      <rect width="275" height="142" rx="8" fill="#132338" stroke="#0ea5e9" stroke-width="1.2"/>
      <rect x="15" y="10" width="245" height="26" rx="6" fill="#0284c7"/>
      <text x="137" y="27" class="deriv-title">١. اسْمُ الفَاعِلِ (يدل على مَن قام بالفعل)</text>
      <text x="260" y="56" class="text-body" text-anchor="end">• من الثلاثي: على وزن <tspan fill="#38bdf8" font-weight="bold">فَاعِل</tspan> (كَاتِب، صَائِم)</text>
      <text x="260" y="74" class="text-body" text-anchor="end">• غير الثلاثي: ميم مضمومة وكسر ما قبل الآخر (<tspan fill="#38bdf8" font-weight="bold">مُكْرِم</tspan>)</text>
      <rect x="10" y="84" width="255" height="48" rx="5" fill="#0a1526" stroke="#1e3a5f" stroke-width="0.8"/>
      <text x="250" y="102" class="ex-q" text-anchor="end">«أَفَاهِمٌ أَخُوكَ الدَّرْسَ؟»</text>
      <text x="250" y="122" class="ex-parse" text-anchor="end">أخوك: فاعل سد مسد الخبر | الدرس: مفعول به</text>
    </g>

    <!-- Deriv 2: Sighat al-Mubalagha -->
    <g transform="translate(320, 38)">
      <rect width="275" height="142" rx="8" fill="#1b2e1e" stroke="#10b981" stroke-width="1.2"/>
      <rect x="15" y="10" width="245" height="26" rx="6" fill="#047857"/>
      <text x="137" y="27" class="deriv-title">٢. صِيَغُ المُبَالَغَةِ (تدل على الكثرة)</text>
      <text x="260" y="56" class="text-body" text-anchor="end">• أوزانها الخمسة: <tspan fill="#34d399" font-weight="bold">مِفْعَال، فَعُول، فَعِيل، فَعِل، فَعَّال</tspan></text>
      <text x="260" y="74" class="text-body" text-anchor="end">• تعمل كفعلها المتعدي تماماً كاسم الفاعل</text>
      <rect x="10" y="84" width="255" height="48" rx="5" fill="#0c2014" stroke="#134e4a" stroke-width="0.8"/>
      <text x="250" y="102" class="ex-q" text-anchor="end">«اللهُ غَفَّارٌ ذُنُوبَ العِبَادِ»</text>
      <text x="250" y="122" class="ex-parse" text-anchor="end">الفاعل ضمير مستتر (هو) | ذنوبَ: مفعول به منصوب</text>
    </g>

    <!-- Deriv 3: Ism al-Maf'ool -->
    <g transform="translate(20, 38)">
      <rect width="280" height="142" rx="8" fill="#2d1c15" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="15" y="10" width="250" height="26" rx="6" fill="#b45309"/>
      <text x="140" y="27" class="deriv-title">٣. اسْمُ المَفْعُولِ (من المبني للمجهول)</text>
      <text x="265" y="56" class="text-body" text-anchor="end">• من الثلاثي: على وزن <tspan fill="#fbbf24" font-weight="bold">مَفْعُول</tspan> (مَكْتُوب، مَبِيع)</text>
      <text x="265" y="74" class="text-body" text-anchor="end">• غير الثلاثي: ميم مضمومة وفتح ما قبل الآخر (<tspan fill="#fbbf24" font-weight="bold">مُحْتَرَم</tspan>)</text>
      <rect x="10" y="84" width="260" height="48" rx="5" fill="#1c100a" stroke="#78350f" stroke-width="0.8"/>
      <text x="255" y="102" class="ex-q" text-anchor="end">«أَمَمْنُوحٌ المُتَفَوِّقُ جَائِزَةً؟»</text>
      <text x="255" y="122" class="ex-parse" text-anchor="end"><tspan fill="#f43f5e" font-weight="bold">المتفوقُ: نَائِبُ فَاعِلٍ مَرْفُوعٌ</tspan> | جائزة: مفعول به ثانٍ</text>
    </g>
  </g>

  <!-- Section 2: Conditions of Working (Shuroot al-'Amal) -->
  <g transform="translate(25, 305)">
    <rect width="910" height="315" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="455" y="24" class="sec-title">٢. شُرُوطُ إِعْمَالِ الْمُشْتَقَّاتِ (قَاعِدَةُ الْمُحَلَّى بِـ أَلْ وَالْمُجَرَّدِ مِنْهَا)</text>

    <!-- Case A: With AL -->
    <g transform="translate(470, 36)">
      <rect width="425" height="85" rx="8" fill="#152438" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="290" y="8" width="125" height="22" rx="4" fill="#0284c7"/>
      <text x="352" y="24" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">الحالة الأولى: المُحَلَّى بِـ (أَلْ)</text>
      <text x="410" y="48" class="text-body" text-anchor="end">• يعمل <tspan fill="#34d399" font-weight="bold">مُطْلَقاً بِلَا قَيْدٍ وَلَا شَرْطٍ</tspan>، في الماضي والحال والاستقبال.</text>
      <text x="410" y="68" class="ex-q" text-anchor="end">«أَنَا الشَّاكِرُ نِعْمَةَ رَبِّي (أَمْسِ أَوِ اليَوْمَ)»</text>
    </g>

    <!-- Case B: Without AL (Mujarrad) -->
    <g transform="translate(15, 36)">
      <rect width="440" height="85" rx="8" fill="#291a2e" stroke="#c084fc" stroke-width="1.2"/>
      <rect x="295" y="8" width="135" height="22" rx="4" fill="#7e22ce"/>
      <text x="362" y="24" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">الحالة الثانية: المُجَرَّدُ مِنْ (أَلْ)</text>
      <text x="425" y="48" class="text-body" text-anchor="end">• يشترط أن يكون منوّناً دالاً على <tspan fill="#facc15" font-weight="bold">الحَالِ أَوِ الاسْتِقْبَالِ</tspan> (لا ماضي فيه).</text>
      <text x="425" y="68" class="text-body" text-anchor="end">• ويشترط اعتماده على واحد من <tspan fill="#c084fc" font-weight="bold">السِّتَّةِ المَشْهُورَةِ</tspan> في الجملة.</text>
    </g>

    <!-- Subgrid of the 6 Dependencies for Mujarrad -->
    <g transform="translate(15, 130)">
      <rect width="880" height="168" rx="8" fill="#0b1322" stroke="#1e293b" stroke-width="1"/>
      <text x="440" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">مُعْتَمَدَاتُ الْمُشْتَقِّ النَّكِرَةِ السِّتَّةِ (يَسْبِقُهُ أَحَدُ هَذِهِ الأَسْبَابِ كَيْ يَعْمَلَ)</text>

      <!-- 1. Mubtada -->
      <g transform="translate(590, 32)">
        <rect width="275" height="58" rx="6" fill="#132338" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end">١. الاعتماد على مُبْتَدَأ:</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«المُعَلِّمُ <tspan fill="#fbbf24">شَارِحٌ</tspan> الدَّرْسَ»</text>
      </g>

      <!-- 2. Nafi -->
      <g transform="translate(300, 32)">
        <rect width="275" height="58" rx="6" fill="#132338" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end">٢. الاعتماد على نَفْيٍ:</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«مَا <tspan fill="#fbbf24">مُهْمِلٌ</tspan> أَخُوكَ وَاجِبَهُ»</text>
      </g>

      <!-- 3. Istifham -->
      <g transform="translate(10, 32)">
        <rect width="275" height="58" rx="6" fill="#132338" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end">٣. الاعتماد على اسْتِفْهَامٍ:</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«هَلْ <tspan fill="#fbbf24">مُسَافِرٌ</tspan> أَبُوكَ غَداً؟»</text>
      </g>

      <!-- 4. Mawsuf -->
      <g transform="translate(590, 98)">
        <rect width="275" height="58" rx="6" fill="#1b2e1e" stroke="#10b981" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end" fill="#34d399">٤. الاعتماد على مَوْصُوفٍ (نعت):</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«مَرَرْتُ بِرَجُلٍ <tspan fill="#fbbf24">حَامِلٍ</tspan> حَقِيبَتَهُ»</text>
      </g>

      <!-- 5. Nida' -->
      <g transform="translate(300, 98)">
        <rect width="275" height="58" rx="6" fill="#1b2e1e" stroke="#10b981" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end" fill="#34d399">٥. الاعتماد على نِدَاءٍ (شبيه بالمضاف):</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«يَا <tspan fill="#fbbf24">طَالِعاً</tspan> جَبَلاً، احْذَرْ»</text>
      </g>

      <!-- 6. Sahib Hal -->
      <g transform="translate(10, 98)">
        <rect width="275" height="58" rx="6" fill="#1b2e1e" stroke="#10b981" stroke-width="0.8"/>
        <text x="265" y="20" class="badge-work" text-anchor="end" fill="#34d399">٦. أن يقع حَالاً لصاحب حال:</text>
        <text x="265" y="44" class="ex-q" font-size="11" text-anchor="end">«أَقْبَلَ الجَيْشُ <tspan fill="#fbbf24">رَافِعاً</tspan> رَايَتَهُ»</text>
      </g>
    </g>
  </g>
</svg>
