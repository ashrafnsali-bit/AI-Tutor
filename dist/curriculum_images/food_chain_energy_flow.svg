<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081026"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#06202a"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="50%" stopColor="#facc15"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="rgba(30, 41, 59, 0.95)"/>
      <stop offset="100%" stopColor="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#10b981"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="460" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="820" height="50" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <text x="440" y="44" text-anchor="middle" fill="#38bdf8" font-size="19" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
    مخطط السلسلة الغذائية وانتقال الطاقة في النظام البيئي (Food Chain &amp; Energy Flow)
  </text>
  <text x="440" y="62" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">
    تتدفق الطاقة من الشمس إلى المنتجات ثم المستهلكات، وتُعاد العناصر عبر المحللات
  </text>

  <!-- Sun: Primary Energy Source -->
  <g transform="translate(65, 175)">
    <circle cx="0" cy="0" r="38" fill="url(#sunGrad)" filter="url(#glow)"/>
    <!-- Sun Rays -->
    <path d="M0,-50 L0,-42 M0,42 L0,50 M-50,0 L-42,0 M42,0 L50,0 M-34,-34 L-28,-28 M28,28 L34,34 M-34,34 L-28,28 M28,-28 L34,-34" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="5" text-anchor="middle" fill="#7c2d12" font-size="14" font-weight="900" font-family="system-ui, sans-serif">الشمس</text>
    <text x="0" y="65" text-anchor="middle" fill="#facc15" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">المصدر الأساسي</text>
    <text x="0" y="80" text-anchor="middle" fill="#fef08a" font-size="10" font-family="system-ui, sans-serif">طاقة شمسية ☀️</text>
  </g>

  <!-- Flow Arrow: Sun -> Plant -->
  <path d="M110,175 Q135,160 155,175" fill="none" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>

  <!-- Step 1: Producer (النبات الأخضر) -->
  <g transform="translate(170, 105)">
    <rect width="125" height="150" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="62" cy="45" r="32" fill="rgba(16, 185, 129, 0.15)"/>
    <!-- Plant Icon Graphic -->
    <path d="M62,65 V35 M62,45 C50,42 45,30 52,25 C58,35 62,45 62,45 M62,40 C74,38 78,25 72,20 C66,30 62,40 62,40" fill="#34d399" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <text x="62" y="96" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">كائن منتج</text>
    <text x="62" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="system-ui, sans-serif">النبات الأخضر</text>
    <text x="62" y="128" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">بناء ضوئي (100%)</text>
    <rect x="22" y="134" width="80" height="12" rx="4" fill="#065f46"/>
    <text x="62" y="142" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="bold">طاقة كاملة</text>
  </g>

  <!-- Flow Arrow: Plant -> Herbivore -->
  <path d="M305,175 L335,175" fill="none" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>
  <text x="320" y="165" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">10% طاقة</text>

  <!-- Step 2: Primary Consumer (الأرنب / آكل عشب) -->
  <g transform="translate(345, 105)">
    <rect width="125" height="150" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="62" cy="45" r="32" fill="rgba(56, 189, 248, 0.15)"/>
    <!-- Herbivore Animal Icon -->
    <ellipse cx="62" cy="50" rx="20" ry="14" fill="#64748b"/>
    <circle cx="76" cy="40" r="10" fill="#94a3b8"/>
    <ellipse cx="78" cy="24" rx="3.5" ry="12" fill="#cbd5e1" transform="rotate(10, 78, 24)"/>
    <circle cx="80" cy="38" r="2" fill="#0f172a"/>
    <text x="62" y="96" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">مستهلك أول</text>
    <text x="62" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="system-ui, sans-serif">الأرنب (آكل عشب)</text>
    <text x="62" y="128" text-anchor="middle" fill="#bae6fd" font-size="10" font-family="system-ui, sans-serif">Primary Consumer</text>
    <rect x="22" y="134" width="80" height="12" rx="4" fill="#0369a1"/>
    <text x="62" y="142" text-anchor="middle" fill="#7dd3fc" font-size="8" font-weight="bold">10% طاقة مخزنة</text>
  </g>

  <!-- Flow Arrow: Herbivore -> Snake -->
  <path d="M480,175 L510,175" fill="none" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>
  <text x="495" y="165" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">1% طاقة</text>

  <!-- Step 3: Secondary Consumer (الثعبان / آكل لحوم) -->
  <g transform="translate(520, 105)">
    <rect width="125" height="150" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="62" cy="45" r="32" fill="rgba(245, 158, 11, 0.15)"/>
    <!-- Snake Icon -->
    <path d="M40,55 Q50,30 62,48 Q75,65 82,40 Q86,28 75,25" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="75" cy="25" r="5" fill="#d97706"/>
    <text x="62" y="96" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">مستهلك ثانٍ</text>
    <text x="62" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="system-ui, sans-serif">الثعبان (آكل لحوم)</text>
    <text x="62" y="128" text-anchor="middle" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">Secondary Consumer</text>
    <rect x="22" y="134" width="80" height="12" rx="4" fill="#78350f"/>
    <text x="62" y="142" text-anchor="middle" fill="#fcd34d" font-size="8" font-weight="bold">1% طاقة مخزنة</text>
  </g>

  <!-- Flow Arrow: Snake -> Falcon -->
  <path d="M655,175 L685,175" fill="none" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>
  <text x="670" y="165" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">0.1% طاقة</text>

  <!-- Step 4: Tertiary Consumer (الصقر / مفترس القمة) -->
  <g transform="translate(695, 105)">
    <rect width="145" height="150" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="72" cy="45" r="32" fill="rgba(239, 68, 68, 0.15)"/>
    <!-- Eagle / Falcon Wings -->
    <path d="M42,42 Q72,15 102,42 Q82,55 72,45 Q62,55 42,42 Z" fill="#b91c1c" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="72" cy="38" r="7" fill="#f87171"/>
    <path d="M72,39 L78,41 L72,44 Z" fill="#fbbf24"/>
    <text x="72" y="96" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">مستهلك ثالث (قمة)</text>
    <text x="72" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="system-ui, sans-serif">الصقر الجارح</text>
    <text x="72" y="128" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="system-ui, sans-serif">Apex Predator</text>
    <rect x="32" y="134" width="80" height="12" rx="4" fill="#7f1d1d"/>
    <text x="72" y="142" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="bold">0.1% طاقة نهائية</text>
  </g>

  <!-- Bottom Panel: Decomposers (الكائنات المحللة وتدوير المادة) -->
  <g transform="translate(170, 290)">
    <rect width="670" height="135" rx="14" fill="rgba(30, 41, 59, 0.7)" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Title -->
    <rect x="20" y="12" width="230" height="28" rx="8" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="135" y="31" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      🍄 الكائنات المحللة (Decomposers)
    </text>

    <!-- Cycle Explanation -->
    <text x="20" y="65" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">
      • <tspan fill="#facc15" font-weight="bold">ديدان الأرض، الفطريات، والبكتيريا:</tspan> تتغذى على بقايا ومخلفات جميع المستويات عند موتها.
    </text>
    <text x="20" y="90" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">
      • <tspan fill="#34d399" font-weight="bold">إعادة التدوير الكيميائي:</tspan> تحلل المواد العضوية وتطلق الأملاح والنيتروجين والفسفور إلى التربة.
    </text>
    <text x="20" y="115" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      ⟳ يمتص النبات الأخضر العناصر المعاد تدويرها من التربة لتبدأ دورة حياة جديدة ومستدامة!
    </text>

    <!-- Recycling Loop Arrow back to Plant -->
    <path d="M-15,60 C-40,60 -40,-50 -5,-110" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowHead)"/>
    <text x="-55" y="-20" fill="#d8b4fe" font-size="10" font-weight="bold" transform="rotate(-90 -55 -20)">إعادة المغذيات للتربة</text>
  </g>
</svg>
