<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stomachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="liverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="smallIntGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="largeIntGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .organ-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #38bdf8; }
    .organ-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
    .label-tag { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #f8fafc; }
  </style>

  <!-- Background -->
  <rect width="920" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="600" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="860" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="50" class="title-main">مخطط تشريح الجهاز الهضمي ورحلة الطعام في جسم الإنسان</text>
  <text x="460" y="72" class="subtitle">Human Digestive System Anatomy &amp; Nutrient Digestion Journey</text>

  <!-- Central Anatomical Drawing (Torso + Digestive Tract) -->
  <g transform="translate(40, 105)">
    <rect width="360" height="490" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="180" y="28" font-family="'Segoe UI', Cairo, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">الرسم التوضيحي للأعضاء</text>

    <!-- Torso Silhouette Background -->
    <path d="M 120,45 C 150,40 210,40 240,45 C 265,55 285,85 285,130 C 285,200 295,350 280,450 C 275,475 250,480 230,480 C 130,480 105,475 100,450 C 85,350 95,200 95,130 C 95,85 115,55 120,45 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Head & Oral Cavity -->
    <!-- Head Outline -->
    <path d="M 140,45 C 140,25 220,25 220,45 C 225,65 210,85 190,85 C 170,85 155,65 140,45 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Mouth & Teeth Cavity -->
    <ellipse cx="180" cy="55" rx="18" ry="8" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5"/>
    <!-- Salivary Gland -->
    <circle cx="205" cy="58" r="7" fill="#fbbf24"/>

    <!-- Pharynx & Esophagus -->
    <path d="M 180,63 L 180,165" fill="none" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Liver (Left lobe & right lobe) -->
    <path d="M 130,175 C 130,155 175,155 185,168 C 190,195 180,210 135,215 C 125,215 125,190 130,175 Z" fill="url(#liverGrad)" stroke="#92400e" stroke-width="1.5"/>
    <!-- Gallbladder (حويصلة صفراوية) -->
    <circle cx="165" cy="205" r="5" fill="#22c55e" stroke="#15803d" stroke-width="1"/>

    <!-- Stomach (المعدة - شكل حرف J) -->
    <path d="M 180,165 C 215,165 240,180 235,215 C 230,240 185,255 170,230 C 165,220 175,200 178,190 Z" fill="url(#stomachGrad)" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- Pancreas (البنكرياس خلف المعدة) -->
    <path d="M 170,230 C 190,225 220,230 225,235 C 220,245 190,245 170,238 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Large Intestine (Frame around small intestine) -->
    <!-- Ascending, Transverse, Descending Colon -->
    <path d="M 135,360 L 135,255 C 135,250 145,245 150,245 L 210,245 C 225,245 225,250 225,255 L 225,360 L 210,380 L 195,380 L 195,420" fill="none" stroke="url(#largeIntGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small Intestine (Coiled inside) -->
    <path d="M 175,255 C 160,265 200,275 160,285 C 200,295 155,305 200,315 C 160,325 195,335 155,345 C 185,355 175,360 145,360" fill="none" stroke="url(#smallIntGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Callout lines and pointer dots -->
    <!-- Line to Mouth -->
    <circle cx="180" cy="55" r="3" fill="#38bdf8"/>
    <line x1="180" y1="55" x2="60" y2="55" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="55" y="59" class="label-tag" fill="#38bdf8" text-anchor="end">١. الفم والأسنان</text>

    <!-- Line to Esophagus -->
    <circle cx="180" cy="120" r="3" fill="#38bdf8"/>
    <line x1="180" y1="120" x2="60" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="55" y="124" class="label-tag" fill="#38bdf8" text-anchor="end">٢. المريء</text>

    <!-- Line to Liver -->
    <circle cx="140" cy="185" r="3" fill="#fbbf24"/>
    <line x1="140" y1="185" x2="60" y2="185" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="55" y="189" class="label-tag" fill="#fbbf24" text-anchor="end">الكبد والصفراء</text>

    <!-- Line to Stomach -->
    <circle cx="215" cy="205" r="3" fill="#f87171"/>
    <line x1="215" y1="205" x2="310" y2="205" stroke="#f87171" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="315" y="209" class="label-tag" fill="#f87171">٣. المعدة</text>

    <!-- Line to Pancreas -->
    <circle cx="210" cy="235" r="3" fill="#facc15"/>
    <line x1="210" y1="235" x2="310" y2="235" stroke="#facc15" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="315" y="239" class="label-tag" fill="#facc15">البنكرياس</text>

    <!-- Line to Small Intestine -->
    <circle cx="180" cy="315" r="3" fill="#fbbf24"/>
    <line x1="180" y1="315" x2="60" y2="315" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="55" y="319" class="label-tag" fill="#fbbf24" text-anchor="end">٤. الأمعاء الدقيقة</text>

    <!-- Line to Large Intestine -->
    <circle cx="225" cy="330" r="3" fill="#34d399"/>
    <line x1="225" y1="330" x2="310" y2="330" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="315" y="334" class="label-tag" fill="#34d399">٥. الأمعاء الغليظة</text>

    <!-- Bottom summary tag inside diagram card -->
    <rect x="30" y="445" width="300" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="180" y="465" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">الطول الإجمالي للقناة الهضمية ≈ ٩ أمتار من الفم للشرج</text>
  </g>

  <!-- Right Side Step-by-Step Cards (Stages of Digestion) -->
  <g transform="translate(420, 105)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="470" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="42" r="16" fill="#0284c7"/>
      <text x="35" y="47" class="badge-text" text-anchor="middle">١</text>
      <text x="65" y="30" class="organ-title">الفم والأسنان والغدد اللعابية (Oral Cavity)</text>
      <text x="65" y="52" class="organ-desc">✦ مضغ وتقطيع الطعام ميكانيكياً بواسطة الأسنان.</text>
      <text x="65" y="70" class="organ-desc">✦ إفراز اللعاب وإنزيم الأميليز لهضم النشويات جزئياً إلى سكريات بسيطة.</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(0, 98)">
      <rect width="470" height="85" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="42" r="16" fill="#db2777"/>
      <text x="35" y="47" class="badge-text" text-anchor="middle">٢</text>
      <text x="65" y="30" class="organ-title" fill="#f472b6">المريء والحركة الدودية (Esophagus &amp; Peristalsis)</text>
      <text x="65" y="52" class="organ-desc">✦ أنبوب عضلي يمرر بلعة الطعام من البلعوم إلى المعدة في ثوانٍ.</text>
      <text x="65" y="70" class="organ-desc">✦ انقباضات عضلية متموجة لاإرادية تدفع الطعام حتى لو كان الشخص مقلوباً!</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(0, 196)">
      <rect width="470" height="92" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="46" r="16" fill="#dc2626"/>
      <text x="35" y="51" class="badge-text" text-anchor="middle">٣</text>
      <text x="65" y="28" class="organ-title" fill="#f87171">المعدة والعصارات الحامضية (Stomach &amp; Gastric Juice)</text>
      <text x="65" y="48" class="organ-desc">✦ وسط حامضي قوي (حمض الهيدروكلوريك HCl) لقتل الجراثيم وتنشيط الإنزيمات.</text>
      <text x="65" y="66" class="organ-desc">✦ هضم البروتينات بواسطة إنزيم الببسين، وتحويل الطعام إلى سائل (الكيموس).</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(0, 301)">
      <rect width="470" height="92" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="46" r="16" fill="#d97706"/>
      <text x="35" y="51" class="badge-text" text-anchor="middle">٤</text>
      <text x="65" y="28" class="organ-title" fill="#fbbf24">الأمعاء الدقيقة والكبد والبنكرياس (Small Intestine)</text>
      <text x="65" y="48" class="organ-desc">✦ العصارة الصفراوية (الكبد) تفتت الدهون إلى مستحلب دهني.</text>
      <text x="65" y="66" class="organ-desc">✦ الامتصاص: جدران الأمعاء والخملات تمتص الفيتامينات والسكريات للدم مباشرة.</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(0, 406)">
      <rect width="470" height="84" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="42" r="16" fill="#059669"/>
      <text x="35" y="47" class="badge-text" text-anchor="middle">٥</text>
      <text x="65" y="28" class="organ-title" fill="#34d399">الأمعاء الغليظة والإخراج (Large Intestine &amp; Rectum)</text>
      <text x="65" y="48" class="organ-desc">✦ إعادة امتصاص الماء والأملاح من الفضلات لمنع الجفاف.</text>
      <text x="65" y="66" class="organ-desc">✦ تجميع الفضلات الصلبة في المستقيم والتخلص منها عبر فتحة الشرج.</text>
    </g>
  </g>
</svg>
