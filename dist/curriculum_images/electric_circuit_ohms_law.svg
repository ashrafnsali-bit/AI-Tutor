<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <marker id="arrowI" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#facc15"/>
    </marker>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .formula-bold { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #facc15; }
    .circuit-label { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #e2e8f0; }
    .body-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="30" y="22" width="860" height="62" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="460" y="48" class="main-title">الدوائر الكهربائية المغلقة وقانون أوم وتوصيل المقاومات</text>
  <text x="460" y="70" class="subtitle">Physics Grade 12 &amp; General Physics: Closed Circuit Ohm's Law, Series vs Parallel Resistor Networks</text>

  <!-- Left Main Panel: Complete Electrical Circuit & Ohm's Triangle -->
  <g transform="translate(30, 98)">
    <rect width="460" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="230" y="28" class="card-title">مخطط الدائرة الكهربائية المتكاملة وقانون أوم</text>

    <!-- Circuit Schematic (Box: x: 30 to 430, y: 45 to 300) -->
    <g transform="translate(25, 45)">
      <!-- Main Loop Wire -->
      <path d="M 60 70 L 150 70 M 230 70 L 350 70 L 350 200 L 250 200 M 170 200 L 60 200 L 60 70" fill="none" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Current Flow Arrows -->
      <line x1="80" y1="70" x2="110" y2="70" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrowI)"/>
      <text x="95" y="60" class="formula-bold" fill="#facc15">I ➔</text>
      <line x1="350" y1="120" x2="350" y2="150" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrowI)"/>
      <line x1="120" y1="200" x2="90" y2="200" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrowI)"/>

      <!-- Switch K (Top wire) -->
      <circle cx="150" cy="70" r="4" fill="#38bdf8"/>
      <circle cx="185" cy="70" r="4" fill="#38bdf8"/>
      <line x1="150" y1="70" x2="183" y2="70" stroke="#10b981" stroke-width="3.5"/>
      <text x="167" y="58" class="circuit-label" fill="#10b981">مفتاح مغلق (K)</text>

      <!-- Ammeter A (Top Right) -->
      <circle cx="270" cy="70" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2.5"/>
      <text x="270" y="75" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">A</text>
      <text x="270" y="48" class="circuit-label" fill="#c084fc" text-anchor="middle">أميتر (توالي)</text>

      <!-- Fixed Resistor R (Right side) -->
      <!-- Voltmeter across Resistor -->
      <path d="M 350 110 L 390 110 L 390 160 L 350 160" fill="none" stroke="#64748b" stroke-dasharray="3,3" stroke-width="2"/>
      <circle cx="390" cy="135" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
      <text x="390" y="140" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">V</text>
      <!-- Resistor box -->
      <rect x="335" y="115" width="30" height="45" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="315" y="142" class="circuit-label" fill="#f59e0b" text-anchor="end">مقاومة R</text>

      <!-- Battery VB and internal resistance r (Bottom wire) -->
      <!-- Positive long thin plate, negative short thick plate -->
      <line x1="200" y1="185" x2="200" y2="215" stroke="#10b981" stroke-width="4"/>
      <line x1="210" y1="192" x2="210" y2="208" stroke="#ef4444" stroke-width="6"/>
      <text x="195" y="180" font-size="11" font-weight="bold" fill="#10b981">+</text>
      <text x="215" y="180" font-size="11" font-weight="bold" fill="#ef4444">-</text>
      <!-- Internal resistance r box -->
      <rect x="225" y="193" width="22" height="14" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="236" y="204" font-family="'Consolas'" font-size="9" fill="#f8fafc" text-anchor="middle">r</text>
      <text x="215" y="235" class="circuit-label" fill="#10b981" text-anchor="middle">عمود كهربي (VB, r)</text>

      <!-- Rheostat / Variable Resistor (Left wire) -->
      <rect x="48" y="115" width="24" height="50" rx="3" fill="#334155" stroke="#ec4899" stroke-width="2"/>
      <line x1="38" y1="155" x2="82" y2="125" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrowI)"/>
      <text x="35" y="142" class="circuit-label" fill="#ec4899" text-anchor="end">ريوستات Rh</text>
    </g>

    <!-- Ohm's Law Triangle & Formula Box (Bottom half: y: 280 to 465) -->
    <g transform="translate(25, 290)">
      <rect width="410" height="175" rx="10" fill="#090d16" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="205" y="24" font-family="'Segoe UI', Cairo" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">مثلث قانون أوم الذهبي (Ohm's Law Triangle)</text>

      <!-- Triangle Graphic -->
      <g transform="translate(30, 35)">
        <polygon points="65,10 10,110 120,110" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
        <line x1="35" y1="65" x2="95" y2="65" stroke="#38bdf8" stroke-width="2"/>
        <line x1="65" y1="65" x2="65" y2="110" stroke="#38bdf8" stroke-width="2"/>
        
        <text x="65" y="50" font-family="'Consolas'" font-size="18" font-weight="bold" fill="#ef4444" text-anchor="middle">V</text>
        <text x="40" y="95" font-family="'Consolas'" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">I</text>
        <text x="90" y="95" font-family="'Consolas'" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">R</text>
      </g>

      <!-- 3 Formulas derived from triangle -->
      <g transform="translate(170, 42)">
        <rect width="225" height="30" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
        <text x="15" y="20" class="formula-bold" fill="#ef4444">V = I × R</text>
        <text x="110" y="20" class="body-desc">فرق الجهد (فولت = أمبير × أوم)</text>

        <rect y="38" width="225" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="15" y="58" class="formula-bold" fill="#38bdf8">I = V / R</text>
        <text x="110" y="58" class="body-desc">شدة التيار (أمبير = كولوم / ث)</text>

        <rect y="76" width="225" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="15" y="96" class="formula-bold" fill="#10b981">R = V / I</text>
        <text x="110" y="96" class="body-desc">المقاومة الكهربية (أوم Ω)</text>
      </g>

      <!-- Bottom takeaway -->
      <text x="205" y="160" font-family="'Segoe UI', Cairo" font-size="11" font-weight="bold" fill="#cbd5e1" text-anchor="middle">عند ثبوت درجة الحرارة: يتناسب فرق الجهد طردياً مع شدة التيار المار في الموصل.</text>
    </g>
  </g>

  <!-- Right Panel: Series vs Parallel Resistor Networks & Closed Loop Law -->
  <g transform="translate(505, 98)">
    <rect width="385" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="192" y="28" class="card-title">مقارنة طرق توصيل المقاومات الكهربية</text>

    <!-- Card 1: Series Connection (التوصيل على التوالي) -->
    <g transform="translate(15, 42)">
      <rect width="355" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#0284c7" fill-opacity="0.3"/>
      <text x="15" y="17" font-family="'Segoe UI', Cairo" font-size="12" font-weight="bold" fill="#38bdf8">1. التوصيل على التوالي (Series Connection)</text>
      
      <!-- Mini Schematic: R1 in line with R2 -->
      <g transform="translate(20, 32)">
        <line x1="0" y1="12" x2="40" y2="12" stroke="#38bdf8" stroke-width="2"/>
        <rect x="40" y="4" width="40" height="16" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="60" y="16" font-family="'Consolas'" font-size="10" fill="#f59e0b" text-anchor="middle">R₁</text>
        <line x1="80" y1="12" x2="110" y2="12" stroke="#38bdf8" stroke-width="2"/>
        <rect x="110" y="4" width="40" height="16" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="130" y="16" font-family="'Consolas'" font-size="10" fill="#f59e0b" text-anchor="middle">R₂</text>
        <line x1="150" y1="12" x2="190" y2="12" stroke="#38bdf8" stroke-width="2"/>
        <text x="210" y="16" class="formula-bold" font-size="11" fill="#38bdf8">Req = R₁ + R₂</text>
      </g>

      <text x="15" y="75" class="body-desc">• شدة التيار ثابتة: I = I₁ = I₂ (مسار واحد للشحنات).</text>
      <text x="15" y="93" class="body-desc">• فرق الجهد يتجزأ طردياً: V = V₁ + V₂ مع قيم المقاومات.</text>
      <text x="15" y="111" class="body-desc">• الغرض: الحصول على مقاومة كبيرة من عدة مقاومات صغيرة.</text>
    </g>

    <!-- Card 2: Parallel Connection (التوصيل على التوازي) -->
    <g transform="translate(15, 172)">
      <rect width="355" height="135" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#059669" fill-opacity="0.3"/>
      <text x="15" y="17" font-family="'Segoe UI', Cairo" font-size="12" font-weight="bold" fill="#34d399">2. التوصيل على التوازي (Parallel Connection)</text>
      
      <!-- Mini Schematic: R1 parallel to R2 -->
      <g transform="translate(20, 32)">
        <path d="M 0 15 L 25 15 L 25 5 L 45 5 M 25 15 L 25 25 L 45 25" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="45" y="0" width="35" height="12" rx="2" fill="#334155" stroke="#10b981" stroke-width="1.2"/>
        <text x="62" y="10" font-family="'Consolas'" font-size="9" fill="#10b981" text-anchor="middle">R₁</text>
        <rect x="45" y="20" width="35" height="12" rx="2" fill="#334155" stroke="#10b981" stroke-width="1.2"/>
        <text x="62" y="30" font-family="'Consolas'" font-size="9" fill="#10b981" text-anchor="middle">R₂</text>
        <path d="M 80 5 L 100 5 L 100 15 L 125 15 M 80 25 L 100 25 L 100 15" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <text x="140" y="15" class="formula-bold" font-size="10" fill="#34d399">1/Req = 1/R₁ + 1/R₂</text>
        <text x="140" y="28" class="formula-bold" font-size="10" fill="#facc15">Req = (R₁·R₂)/(R₁+R₂)</text>
      </g>

      <text x="15" y="80" class="body-desc">• فرق الجهد متساوٍ وثابت: V = V₁ = V₂.</text>
      <text x="15" y="98" class="body-desc">• شدة التيار تتجزأ عكسياً: I = I₁ + I₂ مع قيم المقاومات.</text>
      <text x="15" y="116" class="body-desc">• الغرض: الحصول على مقاومة صغيرة وتوصيل الأجهزة المنزلية بشكل مستقل.</text>
    </g>

    <!-- Card 3: Closed-Circuit Ohm's Law & Terminal Voltage -->
    <g transform="translate(15, 317)">
      <rect width="355" height="148" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#e11d48" fill-opacity="0.3"/>
      <text x="15" y="17" font-family="'Segoe UI', Cairo" font-size="12" font-weight="bold" fill="#fb7185">3. قانون أوم للدوائر المغلقة (Closed Circuit Law)</text>

      <g transform="translate(15, 32)">
        <rect width="325" height="32" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="162" y="21" class="formula-bold" font-size="13" fill="#a5b4fc" text-anchor="middle">I = VB / (Req + r)</text>
      </g>

      <text x="15" y="82" class="body-desc">• فرق الجهد بين قطبي البطارية (حالة تفريغ):</text>
      <text x="40" y="100" class="formula-bold" font-size="12" fill="#facc15">V = VB - I · r</text>
      <text x="15" y="120" class="body-desc">• إذا فُتحت الدائرة (I = 0) أو أهملت المقاومة الداخلية (r = 0):</text>
      <text x="40" y="138" class="formula-bold" font-size="11" fill="#34d399">V = VB (قراءة الفولتميتر = القوة الدافعة)</text>
    </g>
  </g>
</svg>
