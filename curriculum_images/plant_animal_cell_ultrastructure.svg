<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c16"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="620" fill="url(#bgGrad)" rx="16"/>
  <rect width="916" height="616" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" rx="15" opacity="0.6"/>

  <!-- Decorative Top Banner -->
  <path d="M 30,22 Q 460,10 890,22" stroke="url(#blueGlow)" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Diagram Title Area -->
  <g transform="translate(460, 50)" text-anchor="middle">
    <rect x="-340" y="-22" width="680" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" filter="url(#dropShadow)"/>
    <text y="9" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
      🧬 بيولوجيا الخلية: المقارنة الشاملة بين الخلية النباتية والخلية الحيوانية
    </text>
  </g>

  <!-- Left: Animal Cell Card (الخلية الحيوانية) -->
  <g transform="translate(30, 95)">
    <rect width="275" height="425" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <!-- Header -->
    <path d="M 0,14 Q 0,0 14,0 L 261,0 Q 275,0 275,14 L 275,46 L 0,46 Z" fill="#881337" opacity="0.85"/>
    <text x="137" y="28" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffe4e6" text-anchor="middle">
      🐾 الخلية الحيوانية (Animal Cell)
    </text>

    <!-- Visual Cell Illustration -->
    <ellipse cx="137" cy="120" rx="95" ry="60" fill="#2d132c" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.9"/>
    <!-- Nucleus -->
    <ellipse cx="137" cy="120" rx="30" ry="22" fill="#701a75" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="137" cy="120" r="10" fill="#f43f5e"/>
    <text x="137" y="124" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">نواة</text>

    <!-- Organelles in Animal Cell -->
    <!-- Centrosome (جسم مركزي) unique -->
    <g transform="translate(80, 88)">
      <circle cx="0" cy="0" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#000" stroke-width="2"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#000" stroke-width="2"/>
    </g>
    <text x="75" y="78" font-family="'Cairo', sans-serif" font-size="9" font-weight="bold" fill="#fde68a" text-anchor="middle">جسم مركزي ⭐</text>

    <!-- Small Vacuole (فجوة صغيرة) -->
    <circle cx="195" cy="135" r="12" fill="#0284c7" opacity="0.5" stroke="#38bdf8" stroke-width="1"/>
    <text x="195" y="138" font-family="'Cairo', sans-serif" font-size="8" fill="#e0f2fe" text-anchor="middle">فجوات صغيرة</text>

    <!-- Mitochondria -->
    <ellipse cx="85" cy="145" rx="14" ry="7" fill="#b91c1c" stroke="#fca5a5" stroke-width="1"/>

    <!-- Key Unique Features List -->
    <g transform="translate(14, 195)">
      <rect width="247" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <text x="233" y="24" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fda4af" text-anchor="end">
        ⭐ المميزات الحصرية للخلية الحيوانية:
      </text>

      <circle cx="230" cy="48" r="4" fill="#f43f5e"/>
      <text x="218" y="52" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#f43f5e">الجسم المركزي (Centrosome):</tspan> سنتريولان
      </text>
      <text x="218" y="68" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        مسؤول عن تكوين خيوط المغزل بالانقسام.
      </text>

      <circle cx="230" cy="94" r="4" fill="#f43f5e"/>
      <text x="218" y="98" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#f43f5e">الفجوات (Vacuoles):</tspan> صغيرة ومتعددة
      </text>
      <text x="218" y="114" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        تنتشر في السيتوبلازم لتخزين الفضلات والماء.
      </text>

      <circle cx="230" cy="140" r="4" fill="#f43f5e"/>
      <text x="218" y="144" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#f43f5e">السطح الخارجي:</tspan> غشاء بلازمي فقط
      </text>
      <text x="218" y="160" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        لا يوجد جدار خلوي، لذا شكلها مرن وغير محدد.
      </text>

      <circle cx="230" cy="186" r="4" fill="#f43f5e"/>
      <text x="218" y="190" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#f43f5e">اللايسوسومات (Lysosomes):</tspan> وفيرة جداً
      </text>
      <text x="218" y="204" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        لهضم الغذاء والتخلص من العضيات المسنة.
      </text>
    </g>
  </g>

  <!-- Center: Common Shared Organelles (العضيات المشتركة) -->
  <g transform="translate(320, 95)">
    <rect width="280" height="425" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>

    <!-- Header -->
    <path d="M 0,14 Q 0,0 14,0 L 266,0 Q 280,0 280,14 L 280,46 L 0,46 Z" fill="#0369a1" opacity="0.85"/>
    <text x="140" y="28" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#e0f2fe" text-anchor="middle">
      🔄 العضيات المشتركة (Shared Organelles)
    </text>

    <!-- Shared List of Organelles -->
    <g transform="translate(12, 54)">
      
      <!-- 1. Nucleus -->
      <g transform="translate(0, 0)">
        <rect width="256" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="232" cy="26" r="14" fill="#701a75" stroke="#f472b6" stroke-width="1.5"/>
        <text x="232" y="29" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">DNA</text>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">النواة (Nucleus):</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">تحتوي الكروماتين وتتحكم بالأنشطة الحيوية والانقسام.</text>
      </g>

      <!-- 2. Mitochondria -->
      <g transform="translate(0, 60)">
        <rect width="256" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <ellipse cx="232" cy="26" rx="15" ry="9" fill="#991b1b" stroke="#f87171" stroke-width="1.5"/>
        <path d="M 222,26 Q 227,21 232,26 Q 237,31 242,26" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="end">الميتوكوندريا (Mitochondria):</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">مستودع إنزيمات التنفس ومصنع طاقة الخلية (ATP).</text>
      </g>

      <!-- 3. Plasma Membrane -->
      <g transform="translate(0, 120)">
        <rect width="256" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <rect x="220" y="16" width="24" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="222" y1="26" x2="242" y2="26" stroke="#fbbf24" stroke-width="1"/>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">الغشاء البلازمي (Plasma Membrane):</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">طبقة فوسفوليبيدات مزدوجة تنظم مرور المواد بنفاذية اختيارية.</text>
      </g>

      <!-- 4. Endoplasmic Reticulum -->
      <g transform="translate(0, 180)">
        <rect width="256" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <path d="M 220,18 Q 232,22 244,18 Q 232,32 244,36" stroke="#c084fc" stroke-width="2" fill="none"/>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="end">الشبكة الإندوبلازمية (ER):</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">خشنة (تعديل البروتين) وملساء (تخليق الدهون وتخزين الجلوكوز).</text>
      </g>

      <!-- 5. Golgi Apparatus -->
      <g transform="translate(0, 240)">
        <rect width="256" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <path d="M 222,18 C 228,26 228,30 222,34 M 230,16 C 236,26 236,32 230,36" stroke="#34d399" stroke-width="2" fill="none"/>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="end">جهاز جولجي (Golgi Body):</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">فرز وتعديل وتغليف الإفرازات في حويصلات ناقلة.</text>
      </g>

      <!-- 6. Ribosomes & Cytoplasm -->
      <g transform="translate(0, 300)">
        <rect width="256" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="226" cy="24" r="3" fill="#fbbf24"/>
        <circle cx="236" cy="22" r="3" fill="#fbbf24"/>
        <circle cx="231" cy="32" r="3" fill="#fbbf24"/>
        <text x="208" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="end">الريبوسومات والسيتوبلازم:</text>
        <text x="208" y="40" font-family="'Cairo', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">الريبوسومات تبني البروتين، والسيتوبلازم سائل هلامي</text>
        <text x="208" y="52" font-family="'Cairo', sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">يحتوي هيكل الخلية وتحدث به التفاعلات.</text>
      </g>

    </g>
  </g>

  <!-- Right: Plant Cell Card (الخلية النباتية) -->
  <g transform="translate(615, 95)">
    <rect width="275" height="425" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#dropShadow)"/>

    <!-- Header -->
    <path d="M 0,14 Q 0,0 14,0 L 261,0 Q 275,0 275,14 L 275,46 L 0,46 Z" fill="#065f46" opacity="0.85"/>
    <text x="137" y="28" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#d1fae5" text-anchor="middle">
      🌿 الخلية النباتية (Plant Cell)
    </text>

    <!-- Visual Cell Illustration (Hexagonal / Boxy) -->
    <polygon points="45,85 230,85 245,155 210,165 65,165 30,125" fill="#064e3b" stroke="#10b981" stroke-width="3" opacity="0.9"/>
    <polygon points="48,88 227,88 241,152 208,162 67,162 33,125" fill="#047857" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>

    <!-- Central Vacuole (فجوة عصيرية مركزية ضخمة) -->
    <ellipse cx="140" cy="125" rx="48" ry="26" fill="#0284c7" opacity="0.75" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="129" font-family="'Cairo', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">فجوة عصيرية ضخمة ⭐</text>

    <!-- Chloroplasts (بلاستيدات خضراء) -->
    <g transform="translate(62, 105)">
      <ellipse cx="0" cy="0" rx="11" ry="6" fill="#166534" stroke="#86efac" stroke-width="1.2"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#4ade80" stroke-width="1"/>
    </g>
    <text x="62" y="94" font-family="'Cairo', sans-serif" font-size="8" font-weight="bold" fill="#86efac" text-anchor="middle">بلاستيدة خضراء ⭐</text>

    <!-- Nucleus pushed to side -->
    <circle cx="205" cy="125" r="14" fill="#701a75" stroke="#f472b6" stroke-width="1.5"/>
    <text x="205" y="128" font-family="'Segoe UI', sans-serif" font-size="8" fill="#fff" text-anchor="middle">نواة</text>

    <!-- Key Unique Features List -->
    <g transform="translate(14, 195)">
      <rect width="247" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

      <text x="233" y="24" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="end">
        ⭐ المميزات الحصرية للخلية النباتية:
      </text>

      <circle cx="230" cy="48" r="4" fill="#10b981"/>
      <text x="218" y="52" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#10b981">الجدار الخلوي (Cell Wall):</tspan> سيليلوزي قوي
      </text>
      <text x="218" y="68" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        يحيط بالغشاء البلازمي ويعطيها شكلاً ثابتاً ودعامة.
      </text>

      <circle cx="230" cy="94" r="4" fill="#10b981"/>
      <text x="218" y="98" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#10b981">البلاستيدات (Plastids):</tspan> خضراء وملونة
      </text>
      <text x="218" y="114" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        تحتوي كلوروفيل للبناء الضوئي وتخزين النشا.
      </text>

      <circle cx="230" cy="140" r="4" fill="#10b981"/>
      <text x="218" y="144" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#10b981">فجوة عصيرية مركزية ضخمة:</tspan>
      </text>
      <text x="218" y="160" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        تخزن الماء والأملاح وتتحكم بضغط الامتلاء والدعامة.
      </text>

      <circle cx="230" cy="186" r="4" fill="#10b981"/>
      <text x="218" y="190" font-family="'Cairo', sans-serif" font-size="11" fill="#f8fafc" text-anchor="end">
        <tspan font-weight="bold" fill="#10b981">غياب السنتروسوم:</tspan> تنقسم بالقطبين
      </text>
      <text x="218" y="204" font-family="'Cairo', sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">
        يتكثف السيتوبلازم عند القطبين لتكوين خيوط المغزل.
      </text>
    </g>
  </g>

  <!-- Bottom Summary Comparison Banner -->
  <g transform="translate(30, 535)">
    <rect width="860" height="68" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <g transform="translate(20, 22)">
      <circle cx="12" cy="12" r="12" fill="#0284c7"/>
      <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">💡</text>
      <text x="35" y="12" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">قاعدة الامتحان الذهبية:</text>
      <text x="35" y="30" font-family="'Cairo', sans-serif" font-size="11" fill="#cbd5e1">
        الخلية النباتية تنفرد بـ: [جدار خلوي سليلوزي + بلاستيدات خضراء + فجوة عصيرية ضخمة] | الخلية الحيوانية تنفرد بـ: [الجسم المركزي السنتروسوم لتكوين خيوط المغزل].
      </text>
    </g>
  </g>
</svg>
