<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="100%" height="100%">
  <defs>
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0c1a35"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111d33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09101e" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="circleAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="mathShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .math-title { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #f8fafc; }
    .math-sub { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #94a3b8; }
    .h-title { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 16px; }
    .ar-font { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .code-val { font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; }
    .quad-label { font-family: 'Cairo', 'Segoe UI', sans-serif; font-weight: 800; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="980" height="640" fill="url(#mathBg)" rx="16"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 22)">
    <rect width="900" height="66" rx="14" fill="#0f1d38" stroke="#2563eb" stroke-width="1.5" filter="url(#mathShadow)"/>
    <rect x="888" y="0" width="12" height="66" rx="6" fill="#38bdf8"/>
    
    <text x="860" y="30" class="math-title" font-size="22" text-anchor="end">دائرة الوحدة والنسب المثلثية والزوايا الخاصة — رياضيات 1 ثانوي</text>
    <text x="860" y="52" class="math-sub" font-size="13" text-anchor="end">إحداثيات النقطة المثلثية P(cos θ, sin θ)، قاعدة إشارات الأرباع (ASTC)، وتحويلات الراديان والدرجات</text>
    
    <rect x="25" y="17" width="130" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="38" class="math-title" font-size="12" fill="#38bdf8" text-anchor="middle">حساب المثلثات</text>
  </g>

  <!-- Left: Graphic Unit Circle Canvas -->
  <g transform="translate(40, 102)" filter="url(#mathShadow)">
    <rect width="450" height="514" rx="14" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 436 0 Q 450 0 450 14 L 450 36 L 0 36 Z" fill="#0284c7" fill-opacity="0.25"/>
    
    <circle cx="428" cy="18" r="8" fill="#38bdf8"/>
    <text x="428" y="23" class="math-title" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <text x="410" y="24" class="h-title" fill="#7dd3fc" text-anchor="end">التمثيل الهندسي لدائرة الوحدة (r = 1)</text>

    <!-- Center Coordinates of Circle: cx = 225, cy = 250, radius = 140 -->
    <g transform="translate(0, 10)">
      <!-- Circle Fill & Stroke -->
      <circle cx="225" cy="245" r="140" fill="url(#circleAura)" stroke="#38bdf8" stroke-width="2"/>

      <!-- X and Y Axes -->
      <line x1="45" y1="245" x2="405" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
      <line x1="225" y1="425" x2="225" y2="65" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
      <text x="410" y="250" class="code-val" font-size="14" fill="#94a3b8">X</text>
      <text x="225" y="55" class="code-val" font-size="14" fill="#94a3b8" text-anchor="middle">Y</text>

      <!-- Quadrant Watermarks / Badges -->
      <!-- Q1: All + -->
      <rect x="250" y="100" width="130" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="315" y="118" class="quad-label" fill="#34d399" text-anchor="middle">الربع الأول (0° : 90°)</text>
      <text x="315" y="134" class="code-val" font-size="12" fill="#a7f3d0" text-anchor="middle">الكل موجب (All +)</text>

      <!-- Q2: Sin + -->
      <rect x="70" y="100" width="130" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="135" y="118" class="quad-label" fill="#60a5fa" text-anchor="middle">الربع الثاني (90° : 180°)</text>
      <text x="135" y="134" class="code-val" font-size="12" fill="#bfdbfe" text-anchor="middle">جا ، قتا فقط (Sin, Csc +)</text>

      <!-- Q3: Tan + -->
      <rect x="70" y="348" width="130" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="135" y="366" class="quad-label" fill="#fbbf24" text-anchor="middle">الربع الثالث (180° : 270°)</text>
      <text x="135" y="382" class="code-val" font-size="12" fill="#fde68a" text-anchor="middle">ظا ، ظتا فقط (Tan, Cot +)</text>

      <!-- Q4: Cos + -->
      <rect x="250" y="348" width="130" height="42" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="315" y="366" class="quad-label" fill="#f472b6" text-anchor="middle">الربع الرابع (270° : 360°)</text>
      <text x="315" y="382" class="code-val" font-size="12" fill="#fbcfe8" text-anchor="middle">جتا ، قا فقط (Cos, Sec +)</text>

      <!-- Triangle inside circle for angle θ = 40 deg -->
      <!-- cos(40) = 0.766 * 140 = 107.2 -> x = 225 + 107 = 332 -->
      <!-- sin(40) = 0.643 * 140 = 90 -> y = 245 - 90 = 155 -->
      <!-- Right Triangle Polygon -->
      <polygon points="225,245 332,245 332,155" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>

      <!-- Hypotenuse line (radius = 1) -->
      <line x1="225" y1="245" x2="332" y2="155" stroke="#facc15" stroke-width="2.5"/>
      <text x="265" y="195" class="code-val" font-size="13" fill="#fde047">r = 1</text>

      <!-- Horizontal cos theta -->
      <line x1="225" y1="245" x2="332" y2="245" stroke="#38bdf8" stroke-width="3"/>
      <text x="278" y="262" class="code-val" font-size="12.5" fill="#38bdf8">x = cos θ</text>

      <!-- Vertical sin theta -->
      <line x1="332" y1="245" x2="332" y2="155" stroke="#ec4899" stroke-width="3"/>
      <text x="340" y="205" class="code-val" font-size="12.5" fill="#f472b6">y = sin θ</text>

      <!-- Point P on circumference -->
      <circle cx="332" cy="155" r="5" fill="#f43f5e"/>
      <text x="342" y="145" class="code-val" font-size="13" fill="#fff">P(x, y) = (cos θ, sin θ)</text>

      <!-- Angle arc θ -->
      <path d="M 260 245 A 35 35 0 0 0 252 222" fill="none" stroke="#facc15" stroke-width="2"/>
      <text x="268" y="235" class="code-val" font-size="13" fill="#facc15">θ</text>

      <!-- Intercept Points on Axes -->
      <circle cx="365" cy="245" r="3.5" fill="#38bdf8"/>
      <text x="375" y="240" class="code-val" font-size="11" fill="#94a3b8">(1, 0)</text>

      <circle cx="225" cy="105" r="3.5" fill="#38bdf8"/>
      <text x="235" y="100" class="code-val" font-size="11" fill="#94a3b8">(0, 1)</text>

      <circle cx="85" cy="245" r="3.5" fill="#38bdf8"/>
      <text x="50" y="240" class="code-val" font-size="11" fill="#94a3b8">(-1, 0)</text>

      <circle cx="225" cy="385" r="3.5" fill="#38bdf8"/>
      <text x="235" y="402" class="code-val" font-size="11" fill="#94a3b8">(0, -1)</text>

      <!-- Pythagorean Fundamental Identity Banner -->
      <g transform="translate(35, 435)">
        <rect width="380" height="48" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
        <text x="365" y="22" class="ar-font" font-weight="700" fill="#a5b4fc">متطابقة فيثاغورس الأساسية:</text>
        <text x="190" y="40" class="code-val" font-size="15" fill="#facc15" text-anchor="middle">cos² θ + sin² θ = 1</text>
      </g>
    </g>
  </g>

  <!-- Right: Special Angles Table & Formulas Panels -->

  <!-- Panel 2: جدول قيم الزوايا الخاصة (Special Angles) -->
  <g transform="translate(510, 102)" filter="url(#mathShadow)">
    <rect width="430" height="276" rx="14" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 416 0 Q 430 0 430 14 L 430 36 L 0 36 Z" fill="#047857" fill-opacity="0.25"/>
    
    <circle cx="408" cy="18" r="8" fill="#10b981"/>
    <text x="408" y="23" class="math-title" font-size="11" fill="#fff" text-anchor="middle">2</text>
    <text x="390" y="24" class="h-title" fill="#a7f3d0" text-anchor="end">جدول قيم النسب للزوايا الخاصة ومكافئها بالراديان</text>

    <!-- Table Header -->
    <g transform="translate(20, 48)">
      <rect width="390" height="30" rx="6" fill="#1e293b"/>
      <text x="355" y="20" class="ar-font" font-weight="bold" fill="#38bdf8" text-anchor="middle">الزاوية (θ)</text>
      <text x="275" y="20" class="ar-font" font-weight="bold" fill="#fbbf24" text-anchor="middle">الراديان</text>
      <text x="195" y="20" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">جا (sin)</text>
      <text x="115" y="20" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">جتا (cos)</text>
      <text x="35" y="20" class="code-val" font-size="12" fill="#34d399" text-anchor="middle">ظا (tan)</text>
    </g>

    <!-- Table Rows -->
    <!-- Row 0 deg -->
    <g transform="translate(20, 84)">
      <rect width="390" height="26" fill="#0f172a" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="12" fill="#cbd5e1" text-anchor="middle">0°</text>
      <text x="275" y="18" class="code-val" font-size="12" fill="#fde047" text-anchor="middle">0</text>
      <text x="195" y="18" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">0</text>
      <text x="115" y="18" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">1</text>
      <text x="35" y="18" class="code-val" font-size="12" fill="#34d399" text-anchor="middle">0</text>
    </g>

    <!-- Row 30 deg -->
    <g transform="translate(20, 114)">
      <rect width="390" height="26" fill="#1e293b" fill-opacity="0.6" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="12" fill="#cbd5e1" text-anchor="middle">30°</text>
      <text x="275" y="18" class="code-val" font-size="12" fill="#fde047" text-anchor="middle">π / 6</text>
      <text x="195" y="18" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">1/2</text>
      <text x="115" y="18" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">√3 / 2</text>
      <text x="35" y="18" class="code-val" font-size="12" fill="#34d399" text-anchor="middle">1 / √3</text>
    </g>

    <!-- Row 45 deg -->
    <g transform="translate(20, 144)">
      <rect width="390" height="26" fill="#0f172a" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="12" fill="#cbd5e1" text-anchor="middle">45°</text>
      <text x="275" y="18" class="code-val" font-size="12" fill="#fde047" text-anchor="middle">π / 4</text>
      <text x="195" y="18" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">1 / √2</text>
      <text x="115" y="18" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">1 / √2</text>
      <text x="35" y="18" class="code-val" font-size="12" fill="#34d399" text-anchor="middle">1</text>
    </g>

    <!-- Row 60 deg -->
    <g transform="translate(20, 174)">
      <rect width="390" height="26" fill="#1e293b" fill-opacity="0.6" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="12" fill="#cbd5e1" text-anchor="middle">60°</text>
      <text x="275" y="18" class="code-val" font-size="12" fill="#fde047" text-anchor="middle">π / 3</text>
      <text x="195" y="18" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">√3 / 2</text>
      <text x="115" y="18" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">1/2</text>
      <text x="35" y="18" class="code-val" font-size="12" fill="#34d399" text-anchor="middle">√3</text>
    </g>

    <!-- Row 90 deg -->
    <g transform="translate(20, 204)">
      <rect width="390" height="26" fill="#0f172a" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="12" fill="#cbd5e1" text-anchor="middle">90°</text>
      <text x="275" y="18" class="code-val" font-size="12" fill="#fde047" text-anchor="middle">π / 2</text>
      <text x="195" y="18" class="code-val" font-size="12" fill="#f472b6" text-anchor="middle">1</text>
      <text x="115" y="18" class="code-val" font-size="12" fill="#38bdf8" text-anchor="middle">0</text>
      <text x="35" y="18" class="code-val" font-size="12" fill="#ef4444" text-anchor="middle">غير معرّف</text>
    </g>

    <!-- Row 180 & 270 deg summary -->
    <g transform="translate(20, 234)">
      <rect width="390" height="26" fill="#1e293b" fill-opacity="0.6" rx="4"/>
      <text x="355" y="18" class="code-val" font-size="11" fill="#cbd5e1" text-anchor="middle">180° / 270°</text>
      <text x="275" y="18" class="code-val" font-size="11" fill="#fde047" text-anchor="middle">π / 3π/2</text>
      <text x="195" y="18" class="code-val" font-size="11" fill="#f472b6" text-anchor="middle">0 / -1</text>
      <text x="115" y="18" class="code-val" font-size="11" fill="#38bdf8" text-anchor="middle">-1 / 0</text>
      <text x="35" y="18" class="code-val" font-size="11" fill="#34d399" text-anchor="middle">0 / ∞</text>
    </g>
  </g>

  <!-- Panel 3: مقلوب النسب وقوانين القياس الدائري والستيني -->
  <g transform="translate(510, 392)" filter="url(#mathShadow)">
    <rect width="430" height="224" rx="14" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 416 0 Q 430 0 430 14 L 430 36 L 0 36 Z" fill="#b45309" fill-opacity="0.25"/>
    
    <circle cx="408" cy="18" r="8" fill="#f59e0b"/>
    <text x="408" y="23" class="math-title" font-size="11" fill="#fff" text-anchor="middle">3</text>
    <text x="390" y="24" class="h-title" fill="#fde68a" text-anchor="end">مقلوبات النسب المثلثية والتحويل بين الأنظمة</text>

    <!-- Reciprocal Ratios -->
    <g transform="translate(20, 48)">
      <rect width="390" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="375" y="22" class="ar-font" font-weight="bold" fill="#fde047">مقلوبات النسب المثلثية الثلاث:</text>
      
      <g transform="translate(15, 34)">
        <text x="340" y="16" class="code-val" font-size="12" fill="#f43f5e">قتا: csc θ = 1 / sin θ</text>
        <text x="210" y="16" class="code-val" font-size="12" fill="#38bdf8">قا: sec θ = 1 / cos θ</text>
        <text x="75" y="16" class="code-val" font-size="12" fill="#34d399">ظتا: cot θ = 1 / tan θ</text>
      </g>
    </g>

    <!-- Radian Conversion & Arc Length -->
    <g transform="translate(20, 124)">
      <rect width="390" height="86" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Radian to Degree -->
      <text x="375" y="22" class="ar-font" font-weight="bold" fill="#38bdf8">التحويل بين القياس الدائري (rad) والستيني (deg):</text>
      <text x="250" y="46" class="code-val" font-size="13" fill="#67e8f9">θ_rad / π = D° / 180°</text>

      <!-- Arc length formula -->
      <line x1="20" y1="56" x2="370" y2="56" stroke="#1e293b" stroke-width="1"/>
      <text x="375" y="74" class="ar-font" font-size="12" fill="#a7f3d0">طول القوس المقابل للزاوية المركزية:</text>
      <text x="140" y="74" class="code-val" font-size="13" fill="#facc15">l = r · θ_rad</text>
    </g>
  </g>
</svg>
