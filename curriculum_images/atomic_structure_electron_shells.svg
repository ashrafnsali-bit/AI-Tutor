<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <radialGradient id="electronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .shell-label { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; fill: #38bdf8; }
    .formula-bold { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #facc15; }
    .rule-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12.5px; font-weight: bold; }
    .body-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="30" y="22" width="860" height="62" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="460" y="48" class="main-title">التركيب الذري، مستويات الطاقة الرئيسية وقواعد التوزيع الإلكتروني</text>
  <text x="460" y="70" class="subtitle">Chemistry Grade 11 &amp; Prep Science: Bohr Quantized Shells (K,L,M,N), Quantum Orbitals &amp; Aufbau Principle</text>

  <!-- Left Main Panel: Atomic Model, Shells & Quantum Transition -->
  <g transform="translate(30, 98)">
    <rect width="460" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="230" y="28" class="card-title">نموذج الذرة ومستويات الطاقة (Bohr Shells)</text>

    <!-- Concentric Shells Center: cx = 210, cy = 250 -->
    <g transform="translate(20, 15)">
      <!-- Shell N (n=4): r=180 -->
      <circle cx="210" cy="235" r="180" fill="none" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
      <!-- Shell M (n=3): r=135 -->
      <circle cx="210" cy="235" r="135" fill="none" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
      <!-- Shell L (n=2): r=90 -->
      <circle cx="210" cy="235" r="90" fill="none" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
      <!-- Shell K (n=1): r=45 -->
      <circle cx="210" cy="235" r="45" fill="none" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="2"/>

      <!-- Central Nucleus -->
      <circle cx="210" cy="235" r="24" fill="url(#nucleusGrad)" stroke="#fca5a5" stroke-width="2" filter="url(#glowFilter)"/>
      <text x="210" y="233" font-family="'Consolas', Cairo" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">النواة</text>
      <text x="210" y="245" font-family="'Consolas'" font-size="9" fill="#fef08a" text-anchor="middle">+p, n°</text>

      <!-- Electrons in K shell (2 e-) -->
      <circle cx="210" cy="190" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="210" cy="280" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>

      <!-- Electrons in L shell (sample) -->
      <circle cx="120" cy="235" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="300" cy="235" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="146" cy="171" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="274" cy="299" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>

      <!-- Electrons in M shell (sample) -->
      <circle cx="210" cy="100" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="210" cy="370" r="5" fill="url(#electronGlow)" stroke="#ffffff" stroke-width="1"/>

      <!-- Shell Labels on the top axis -->
      <rect x="235" y="180" width="70" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="270" y="193" class="shell-label" font-size="10" text-anchor="middle">K (n=1) 2e⁻</text>

      <rect x="275" y="140" width="70" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="310" y="153" class="shell-label" font-size="10" text-anchor="middle">L (n=2) 8e⁻</text>

      <rect x="315" y="95" width="75" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="352" y="108" class="shell-label" font-size="10" text-anchor="middle">M (n=3) 18e⁻</text>

      <rect x="345" y="50" width="75" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="382" y="63" class="shell-label" font-size="10" text-anchor="middle">N (n=4) 32e⁻</text>

      <!-- Quantum Jump & Photon Emission Wave -->
      <path d="M 120 235 C 95 210, 80 160, 75 100" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3,3"/>
      <!-- Emitted Photon Wave (Yellow) -->
      <path d="M 75 100 Q 60 90, 50 105 T 25 100" fill="none" stroke="#facc15" stroke-width="2.5"/>
      <text x="60" y="80" font-family="'Segoe UI', Cairo" font-size="10" font-weight="bold" fill="#facc15">فوتون طيف منبعث</text>
      <text x="60" y="93" font-family="'Consolas'" font-size="10" fill="#facc15">ΔE = h·ν</text>
    </g>

    <!-- Bottom Capacity Rule Box -->
    <g transform="translate(25, 415)">
      <rect width="410" height="52" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="205" y="22" font-family="'Segoe UI', Cairo" font-size="12" font-weight="bold" fill="#facc15" text-anchor="middle">قاعدة بور لتشبع المستويات بالإلكترونات: (2n²)</text>
      <text x="205" y="40" class="formula-bold" text-anchor="middle">K=2(1)²=2e⁻ | L=2(2)²=8e⁻ | M=2(3)²=18e⁻ | N=2(4)²=32e⁻</text>
    </g>
  </g>

  <!-- Right Panel: Modern Quantum Theory, Subshells & Aufbau Principle -->
  <g transform="translate(505, 98)">
    <rect width="385" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="192" y="28" class="card-title">المستويات الفرعية وقواعد التوزيع الإلكتروني</text>

    <!-- Subshells & Orbitals Table -->
    <g transform="translate(15, 42)">
      <rect width="355" height="120" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#4338ca" fill-opacity="0.3"/>
      <text x="15" y="17" class="rule-title" fill="#a5b4fc">1. المستويات الفرعية والأوربيتالات (Sublevels &amp; Orbitals)</text>
      
      <!-- Table Rows -->
      <g transform="translate(15, 30)">
        <text x="0" y="16" class="formula-bold" fill="#38bdf8">المستوى s:</text>
        <text x="80" y="16" class="body-desc">أوربيتال واحد كروي متماثل يتسع لـ 2 إلكترون (s²)</text>

        <text x="0" y="36" class="formula-bold" fill="#34d399">المستوى p:</text>
        <text x="80" y="36" class="body-desc">3 أوربيتالات متسامتة (px, py, pz) تتسع لـ 6 إلكترونات (p⁶)</text>

        <text x="0" y="56" class="formula-bold" fill="#f59e0b">المستوى d:</text>
        <text x="80" y="56" class="body-desc">5 أوربيتالات معقدة تتسع لـ 10 إلكترونات (d¹⁰)</text>

        <text x="0" y="76" class="formula-bold" fill="#f43f5e">المستوى f:</text>
        <text x="80" y="76" class="body-desc">7 أوربيتالات معقدة جداً تتسع لـ 14 إلكتروناً (f¹⁴)</text>
      </g>
    </g>

    <!-- Aufbau Principle (مبدأ البناء التصاعدي) -->
    <g transform="translate(15, 172)">
      <rect width="355" height="135" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#059669" fill-opacity="0.3"/>
      <text x="15" y="17" class="rule-title" fill="#34d399">2. مبدأ البناء التصاعدي (Aufbau Principle)</text>
      
      <text x="15" y="44" class="body-desc">• النص: لابد للإلكترونات أن تملأ المستويات الفرعية ذات الطاقة المنخفضة أولاً ثم المستويات الأعلى طاقة.</text>
      <text x="15" y="64" class="body-desc">• مقياس الطاقة لأي مستوى فرعي هو حاصل جمع: (n + l)</text>
      
      <!-- Energy Order Ribbon -->
      <rect x="15" y="78" width="325" height="45" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="177" y="96" class="formula-bold" font-size="11" fill="#38bdf8" text-anchor="middle">1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d &lt; 4p &lt; 5s ...</text>
      <text x="177" y="114" font-family="'Segoe UI', Cairo" font-size="10" fill="#facc15" text-anchor="middle">يمتلئ 4s قبل 3d لأن (4+0=4) أقل طاقة من (3+2=5)</text>
    </g>

    <!-- Hund's Rule & Pauli Exclusion Principle -->
    <g transform="translate(15, 317)">
      <rect width="355" height="148" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <rect x="0" y="0" width="355" height="24" rx="8" fill="#d97706" fill-opacity="0.3"/>
      <text x="15" y="17" class="rule-title" fill="#fbbf24">3. قاعدة هوند ومبدأ باولي للاستبعاد</text>

      <text x="15" y="44" class="body-desc">• قاعدة هوند (Hund): لا يحدث ازدواج بين إلكترونين في أوربيتال فرعي واحد إلا بعد أن تشغل أوربيتالاته فرادى أولاً بنفس اتجاه الغزل (↑).</text>
      
      <!-- Mini Orbital Boxes for p3: [↑] [↑] [↑] -->
      <g transform="translate(60, 56)">
        <rect x="0" y="0" width="24" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="12" y="17" class="formula-bold" fill="#38bdf8" text-anchor="middle">↑</text>
        <rect x="28" y="0" width="24" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="40" y="17" class="formula-bold" fill="#38bdf8" text-anchor="middle">↑</text>
        <rect x="56" y="0" width="24" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="68" y="17" class="formula-bold" fill="#38bdf8" text-anchor="middle">↑</text>
        <text x="95" y="16" class="body-desc">غزل مفرد متوازٍ يقلل قوى التنافر</text>
      </g>

      <text x="15" y="105" class="body-desc">• مبدأ باولي (Pauli): لا يتفق إلكترونان في ذرة واحدة في نفس أعداد الكم الأربعة (n, l, m, s) أبداً؛ إذا اتفقا في المدار لابد أن يختلفا في الغزل (↑↓).</text>
      <text x="15" y="138" font-family="'Segoe UI', Cairo" font-size="10.5" font-weight="bold" fill="#34d399">★ الاستقرار الذري: يكون الأوربيتال أشد استقراراً وهو تام الامتلاء أو نصف ممتلئ.</text>
    </g>
  </g>
</svg>
