<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="circuitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </linearGradient>
    <linearGradient id="wireGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .sec-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
    .comp-name { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; font-weight: bold; fill: #facc15; text-anchor: middle; }
    .formula-txt { font-family: 'Consolas', 'Courier New', monospace; font-size: 18px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .rule-body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="url(#circuitBg)"/>
  <rect x="8" y="8" width="944" height="624" rx="14" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="25" y="18" width="910" height="62" rx="10" fill="#132338" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="480" y="44" class="title-main">مخطط الدوائر الكهربائية المغلقة وقانون أوم (Ohm's Law) وتوصيل المقاومات</text>
  <text x="480" y="66" class="subtitle">الفيزياء المعتمدة • عناصر الدائرة، مثلث قانون أوم V = I × R، والمقارنة بين التوصيل على التوالي والتوازي</text>

  <!-- Section 1: Standard Closed Circuit Diagram -->
  <g transform="translate(25, 92)">
    <rect width="570" height="280" rx="12" fill="#0d1829" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="285" y="26" class="sec-title">١. الدائرة الكهربائية المغلقة ورموز الأجهزة القياسية</text>

    <!-- Circuit Wire Loop -->
    <path d="M 70 80 L 500 80 L 500 230 L 70 230 Z" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Battery (DC Source) Top Center -->
    <g transform="translate(260, 65)">
      <rect x="-35" y="-5" width="70" height="30" fill="#0d1829"/>
      <line x1="-15" y1="5" x2="-15" y2="25" stroke="#ef4444" stroke-width="4"/>
      <line x1="-5" y1="-2" x2="-5" y2="32" stroke="#ef4444" stroke-width="2"/>
      <line x1="5" y1="5" x2="5" y2="25" stroke="#3b82f6" stroke-width="4"/>
      <line x1="15" y1="-2" x2="15" y2="32" stroke="#3b82f6" stroke-width="2"/>
      <text x="0" y="-12" class="comp-name" fill="#f87171">البطارية (مصدر القوة الدافعة V)</text>
    </g>

    <!-- Switch (Closed) Right Wire -->
    <g transform="translate(500, 155)">
      <rect x="-10" y="-20" width="20" height="40" fill="#0d1829"/>
      <circle cx="0" cy="-12" r="4" fill="#facc15"/>
      <circle cx="0" cy="12" r="4" fill="#facc15"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#facc15" stroke-width="3"/>
      <text x="18" y="5" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#facc15">مفتاح مغلق (K)</text>
    </g>

    <!-- Resistor R (Bottom) -->
    <g transform="translate(255, 230)">
      <rect x="-40" y="-12" width="80" height="24" fill="#0d1829"/>
      <path d="M -35 0 L -25 -10 L -15 10 L -5 -10 L 5 10 L 15 -10 L 25 10 L 35 0" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="0" y="30" class="comp-name" fill="#fbbf24">مقاومة ثابتة (R - أوم)</text>
    </g>

    <!-- Voltmeter (Parallel to R) -->
    <g transform="translate(255, 260)">
      <line x1="-50" y1="-30" x2="-50" y2="-10" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="50" y1="-30" x2="50" y2="-10" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="-50" y1="-10" x2="-18" y2="-10" stroke="#a855f7" stroke-width="1.5"/>
      <line x1="18" y1="-10" x2="50" y2="-10" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="0" cy="-10" r="16" fill="#1e1838" stroke="#a855f7" stroke-width="2"/>
      <text x="0" y="-4" class="formula-txt" fill="#c084fc">V</text>
      <text x="0" y="16" font-family="'Cairo', sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">فولتميتر (توازي)</text>
    </g>

    <!-- Ammeter (Series on Left Wire) -->
    <g transform="translate(70, 155)">
      <rect x="-20" y="-20" width="40" height="40" fill="#0d1829"/>
      <circle cx="0" cy="0" r="16" fill="#132338" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="6" class="formula-txt" fill="#34d399">A</text>
      <text x="-25" y="4" font-family="'Cairo', sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="end">أميتر (توالي)</text>
    </g>
  </g>

  <!-- Section 2: Ohm's Triangle -->
  <g transform="translate(615, 92)">
    <rect width="320" height="280" rx="12" fill="#0d1829" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="160" y="26" class="sec-title">٢. مثلث قانون أوم (Ohm's Triangle)</text>

    <!-- Triangle Shape -->
    <g transform="translate(160, 135)">
      <polygon points="0,-75 -90,65 90,65" fill="#162238" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Internal Dividing Lines -->
      <line x1="-50" y1="5" x2="50" y2="5" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="5" x2="0" y2="65" stroke="#38bdf8" stroke-width="2"/>

      <!-- Letters -->
      <text x="0" y="-20" font-family="'Consolas', monospace" font-size="28" font-weight="bold" fill="#ef4444" text-anchor="middle">V</text>
      <text x="0" y="-5" font-family="'Cairo', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">فرق الجهد (فولت)</text>

      <text x="-45" y="38" font-family="'Consolas', monospace" font-size="24" font-weight="bold" fill="#10b981" text-anchor="middle">I</text>
      <text x="-45" y="54" font-family="'Cairo', sans-serif" font-size="9" fill="#86efac" text-anchor="middle">التيار (أمبير)</text>

      <text x="45" y="38" font-family="'Consolas', monospace" font-size="24" font-weight="bold" fill="#f59e0b" text-anchor="middle">R</text>
      <text x="45" y="54" font-family="'Cairo', sans-serif" font-size="9" fill="#fde047" text-anchor="middle">المقاومة (أوم)</text>
    </g>

    <!-- Triangle Formulas -->
    <rect x="15" y="215" width="290" height="52" rx="6" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
    <text x="145" y="235" class="formula-txt" font-size="13" fill="#fbbf24">V = I × R  |  I = V ÷ R  |  R = V ÷ I</text>
    <text x="145" y="255" font-family="'Cairo', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">عند ثبوت درجة الحرارة: يتناسب التيار طردياً مع فرق الجهد</text>
  </g>

  <!-- Section 3: Series vs Parallel Resistor Connections -->
  <g transform="translate(25, 385)">
    <rect width="910" height="235" rx="12" fill="#0d1829" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="455" y="24" class="sec-title">٣. المقارنة الشاملة بين توصيل المقاومات على التوالي والتوازي</text>

    <!-- Series Card -->
    <g transform="translate(470, 36)">
      <rect width="425" height="185" rx="8" fill="#132338" stroke="#0ea5e9" stroke-width="1.2"/>
      <rect x="15" y="8" width="395" height="26" rx="4" fill="#0284c7"/>
      <text x="212" y="26" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">التوصيل على التوالي (Series)</text>
      <text x="405" y="54" class="rule-body" text-anchor="end">• الغرض: الحصول على <tspan fill="#facc15" font-weight="bold">مقاومة كبرى</tspan> من مقاومات صغيرة.</text>
      <text x="405" y="74" class="rule-body" text-anchor="end">• شدة التيار: <tspan fill="#34d399" font-weight="bold">ثابتة لا تتجزأ</tspan> في جميع المقاومات (I_total = I₁ = I₂ = I₃).</text>
      <text x="405" y="94" class="rule-body" text-anchor="end">• فرق الجهد: يتجزأ بنسب طردية مع المقاومات (V_total = V₁ + V₂ + V₃).</text>
      <rect x="15" y="105" width="395" height="34" rx="6" fill="#0a1526" stroke="#0284c7" stroke-width="0.8"/>
      <text x="212" y="127" class="formula-txt" font-size="14" fill="#38bdf8">R_eq = R₁ + R₂ + R₃ + ... + R_n</text>
      <text x="405" y="156" class="rule-body" text-anchor="end" fill="#f87171">⚠️ إذا احترق أحد المصابيح أو فُتح المسار تنطفئ باقي المصابيح جميعاً.</text>
    </g>

    <!-- Parallel Card -->
    <g transform="translate(15, 36)">
      <rect width="440" height="185" rx="8" fill="#1b2e1e" stroke="#10b981" stroke-width="1.2"/>
      <rect x="15" y="8" width="410" height="26" rx="4" fill="#047857"/>
      <text x="220" y="26" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">التوصيل على التوازي (Parallel - توصيل المنازل)</text>
      <text x="420" y="54" class="rule-body" text-anchor="end">• الغرض: الحصول على <tspan fill="#facc15" font-weight="bold">مقاومة صغرى</tspan> وتوفير مسارات مستقلة للتيار.</text>
      <text x="420" y="74" class="rule-body" text-anchor="end">• فرق الجهد: <tspan fill="#38bdf8" font-weight="bold">ثابت ومتساوٍ</tspan> على جميع الفروع (V_total = V₁ = V₂ = V₃).</text>
      <text x="420" y="94" class="rule-body" text-anchor="end">• شدة التيار: تتجزأ بنسب عكسية مع المقاومات (I_total = I₁ + I₂ + I₃).</text>
      <rect x="15" y="105" width="410" height="34" rx="6" fill="#0c2014" stroke="#047857" stroke-width="0.8"/>
      <text x="220" y="127" class="formula-txt" font-size="14" fill="#34d399">1/R_eq = 1/R₁ + 1/R₂ + 1/R₃</text>
      <text x="420" y="156" class="rule-body" text-anchor="end" fill="#34d399">✓ إذا تلِف أحد الأجهزة تعمل باقي الأجهزة والمسارات بكفاءة ودون انقطاع.</text>
    </g>
  </g>
</svg>
