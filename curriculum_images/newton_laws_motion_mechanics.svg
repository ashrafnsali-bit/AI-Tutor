<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="620" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="936" height="596" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- HEADER -->
  <g id="headerGroup">
    <rect x="25" y="24" width="910" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="58" cy="56" r="20" fill="#0284c7" opacity="0.2"/>
    <text x="58" y="63" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">F</text>
    
    <text x="95" y="48" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
      قوانين نيوتن للحركة وميكانيكا القوى (Newton's Laws of Motion &amp; Gravitation)
    </text>
    <text x="95" y="70" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
      المفاهيم المعتمدة لمنهاج الفيزياء: القصور الذاتي (ΣF=0)، قانون القوة والتسارع (F=m·a)، الفعل ورد الفعل، وقانون الجذب العام
    </text>
    <rect x="800" y="38" width="120" height="36" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="860" y="61" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      الفيزياء - الميكانيكا
    </text>
  </g>

  <!-- 2x2 GRID OF COMPREHENSIVE CARDS -->

  <!-- CARD 1: NEWTON'S FIRST LAW (القصور الذاتي) -->
  <g id="cardLaw1" transform="translate(30, 105)">
    <rect width="440" height="235" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="220" height="28" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="125" y="31" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc" text-anchor="middle">
      القانون الأول: القصور الذاتي (Inertia)
    </text>
    <rect x="330" y="12" width="95" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text x="377" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      Σ F = 0 ➔ v = ثابـت
    </text>

    <!-- Visual Demonstration: Cart & Inertia Body -->
    <g transform="translate(25, 60)">
      <!-- Ground surface with friction hash -->
      <line x1="10" y1="90" x2="380" y2="90" stroke="#64748b" stroke-width="2"/>
      <line x1="20" y1="90" x2="10" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="60" y1="90" x2="50" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="100" y1="90" x2="90" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="140" y1="90" x2="130" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="180" y1="90" x2="170" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="220" y1="90" x2="210" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="260" y1="90" x2="250" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="300" y1="90" x2="290" y2="100" stroke="#475569" stroke-width="1.5"/>
      <line x1="340" y1="90" x2="330" y2="100" stroke="#475569" stroke-width="1.5"/>

      <!-- Moving Cart -->
      <rect x="110" y="45" width="130" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
      <!-- Wheels -->
      <circle cx="135" cy="88" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="215" cy="88" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

      <!-- Object on Cart lurching forward when stopping -->
      <rect x="155" y="15" width="40" height="30" rx="4" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
      <path d="M 195 25 L 245 25" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowRose)"/>
      <text x="250" y="28" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="bold" fill="#fda4af">اندفاع للأمام (قصور)</text>

      <path d="M 75 65 L 105 65" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)"/>
      <text x="25" y="68" font-family="'Cairo', sans-serif" font-size="10" font-weight="bold" fill="#7dd3fc">حركة منتظمة</text>
    </g>

    <!-- Law Rule Explanation -->
    <rect x="15" y="165" width="410" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="184" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">
      • نص القانون: «يظل الجسم الساكن ساكناً، والمتحرك في خط مستقيم بسرعة منتظمة متحركاً، ما لم تؤثر عليه قوة محصلة خارجية تغيّر حالته».
    </text>
    <text x="25" y="208" font-family="'Cairo', sans-serif" font-size="10.5" fill="#94a3b8">
      • التطبيق اليومي: ارتداء حزام الأمان بالسيارة يقي الركاب من الاندفاع بفعل القصور الذاتي عند التوقف المفاجئ.
    </text>
  </g>

  <!-- CARD 2: NEWTON'S SECOND LAW (القوة والتسارع) -->
  <g id="cardLaw2" transform="translate(490, 105)">
    <rect width="440" height="235" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="220" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="31" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
      القانون الثاني: القوة والتسارع (F = m · a)
    </text>
    <rect x="330" y="12" width="95" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="377" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">
      1 N = 1 kg·m/s²
    </text>

    <!-- Visual Demonstration: Formula Triangle & Force Vector -->
    <g transform="translate(25, 55)">
      <!-- Triangle Formula -->
      <polygon points="65,15 15,95 115,95" fill="#042f2e" stroke="#34d399" stroke-width="2"/>
      <line x1="33" y1="60" x2="97" y2="60" stroke="#34d399" stroke-width="1.5"/>
      <line x1="65" y1="60" x2="65" y2="95" stroke="#34d399" stroke-width="1.5"/>
      <text x="65" y="45" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">F (القوة)</text>
      <text x="40" y="82" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fef08a" text-anchor="middle">m (ك)</text>
      <text x="90" y="82" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">a (ت)</text>

      <!-- Dynamic Block on Table -->
      <g transform="translate(135, 10)">
        <line x1="0" y1="80" x2="250" y2="80" stroke="#64748b" stroke-width="1.5"/>
        <rect x="60" y="35" width="60" height="45" rx="5" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
        <text x="90" y="62" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">m</text>
        <!-- Pulling Force F -->
        <path d="M 120 58 L 195 58" stroke="#34d399" stroke-width="4" marker-end="url(#arrowEmerald)"/>
        <text x="160" y="48" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">القوة F</text>
        <!-- Acceleration a -->
        <path d="M 120 70 L 175 70" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3" marker-end="url(#arrowCyan)"/>
        <text x="145" y="96" font-family="'Cairo', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">التسارع a ➔</text>
      </g>
    </g>

    <!-- Law Rule Explanation -->
    <rect x="15" y="165" width="410" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="184" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">
      • نص القانون: «القوة المحصلة المؤثرة على جسم تكسبه تسارعاً يتناسب طردياً مع القوة وعكسياً مع كتلته».
    </text>
    <text x="25" y="208" font-family="'Cairo', sans-serif" font-size="10.5" fill="#94a3b8">
      • العلاقات الثلاث: F = m · a  |  a = F / m  |  m = F / a (النيوتن = كجم · م/ث²).
    </text>
  </g>

  <!-- CARD 3: NEWTON'S THIRD LAW (الفعل ورد الفعل) -->
  <g id="cardLaw3" transform="translate(30, 355)">
    <rect width="440" height="235" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="220" height="28" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="125" y="31" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fecdd3" text-anchor="middle">
      القانون الثالث: الفعل ورد الفعل (Action &amp; Reaction)
    </text>
    <rect x="330" y="12" width="95" height="28" rx="6" fill="#310410" stroke="#f43f5e" stroke-width="1"/>
    <text x="377" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#f43f5e" text-anchor="middle">
      F₁ = −F₂
    </text>

    <!-- Visual Demonstration: Rocket Propulsion -->
    <g transform="translate(35, 45)">
      <!-- Rocket Body -->
      <g transform="translate(140, 10)">
        <!-- Nose cone -->
        <polygon points="30,0 15,25 45,25" fill="#f43f5e"/>
        <!-- Fuselage -->
        <rect x="15" y="25" width="30" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
        <circle cx="30" cy="40" r="6" fill="#38bdf8"/>
        <!-- Fins -->
        <polygon points="15,50 0,65 15,65" fill="#e11d48"/>
        <polygon points="45,50 60,65 45,65" fill="#e11d48"/>
        <!-- Exhaust Fire -->
        <polygon points="20,65 30,95 40,65" fill="#fbbf24"/>
        <polygon points="24,65 30,85 36,65" fill="#f97316"/>

        <!-- Thrust Force Vectors -->
        <!-- Action: Gas downwards -->
        <path d="M 30 75 L 30 115" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowAmber)"/>
        <text x="45" y="110" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="bold" fill="#fbbf24">قوة الفعل (غازات لأسفل)</text>

        <!-- Reaction: Rocket upwards -->
        <path d="M 30 15 L 30 -15" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)"/>
        <text x="45" y="-5" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8">رد الفعل (اندفاع الصاروخ لأعلى)</text>
      </g>
    </g>

    <!-- Law Rule Explanation -->
    <rect x="15" y="165" width="410" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="184" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">
      • نص القانون: «لكل قوة فعل، قوة رد فعل؛ مساوية لها في المقدار ومضادة لها في الاتجاه».
    </text>
    <text x="25" y="208" font-family="'Cairo', sans-serif" font-size="10.5" fill="#94a3b8">
      • علل: قوتا الفعل ورد الفعل لا تحدثان اتزاناً لأنهما تؤثران على جسمين مختلفين (الغاز والصاروخ).
    </text>
  </g>

  <!-- CARD 4: UNIVERSAL GRAVITATION LAW (قانون الجذب العام) -->
  <g id="cardLaw4" transform="translate(490, 355)">
    <rect width="440" height="235" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="220" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="125" y="31" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">
      قانون الجذب العام للكون (Universal Gravity)
    </text>
    <rect x="300" y="12" width="125" height="28" rx="6" fill="#291102" stroke="#f59e0b" stroke-width="1"/>
    <text x="362" y="30" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">
      F = G · (m₁ · m₂) / r²
    </text>

    <!-- Visual Demonstration: Two celestial bodies attracting -->
    <g transform="translate(30, 50)">
      <!-- Mass 1 (Big planet) -->
      <circle cx="70" cy="50" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="70" y="55" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">m₁</text>

      <!-- Mass 2 (Moon/Small planet) -->
      <circle cx="310" cy="50" r="20" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
      <text x="310" y="55" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">m₂</text>

      <!-- Mutual Gravitational Force Vectors -->
      <path d="M 105 50 L 165 50" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowRose)"/>
      <text x="135" y="40" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">F₁₂ ➔</text>

      <path d="M 285 50 L 225 50" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowRose)"/>
      <text x="255" y="40" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">⬅ F₂₁</text>

      <!-- Distance line between centers (r) -->
      <line x1="70" y1="88" x2="310" y2="88" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="70" y1="82" x2="70" y2="94" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="310" y1="82" x2="310" y2="94" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="190" y="85" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9" text-anchor="middle">المسافة بين المركزين (r)</text>
    </g>

    <!-- Law Rule Explanation -->
    <rect x="15" y="165" width="410" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="184" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">
      • نص القانون: «كل كتلتين في الكون تتجاذبان بقوة تتناسب طردياً مع حاصل ضرب الكتلتين، وعكسياً مع مربع المسافة بين مركزيهما».
    </text>
    <text x="25" y="208" font-family="'Cairo', sans-serif" font-size="10.5" fill="#94a3b8">
      • ثابت الجذب العام: G = 6.67 × 10⁻¹¹ N·m²/kg² (ثابت كوني لا يتغير في أي مكان بالكون).
    </text>
  </g>
</svg>
