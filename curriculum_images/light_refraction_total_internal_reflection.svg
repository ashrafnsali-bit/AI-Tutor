<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassDense" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="fiberCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ray Markers -->
    <marker id="rayYellow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#facc15"/>
    </marker>
    <marker id="rayGreen" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#34d399"/>
    </marker>
    <marker id="rayRed" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .formula-bold { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #facc15; text-anchor: middle; }
    .label-ray { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11px; font-weight: bold; }
    .body-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="860" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="50" class="title-main">مخطط انكسار الضوء، الزاوية الحرجة، والانعكاس الكلي الداخلي</text>
  <text x="460" y="72" class="subtitle">Physics Grade 11: Snell's Law, Critical Angle (θc) &amp; Total Internal Reflection in Optical Fibers</text>

  <!-- Left Main Panel: 3 Light Ray Behaviors (Normal, Critical, Total Internal) -->
  <g transform="translate(30, 105)">
    <rect width="470" height="470" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="235" y="28" class="card-title">مسارات الضوء عند الانتقال من وسط أكبر كثافة لأقل كثافة</text>

    <!-- Refraction Scene -->
    <g transform="translate(30, 45)">
      <!-- Medium 2 (Top): Air (n2 = 1.0) -->
      <rect x="0" y="0" width="410" height="180" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" font-family="'Segoe UI', Cairo, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">الوسط ٢: هواء أو وسط أقل كثافة (n₂)</text>

      <!-- Interface Boundary -->
      <line x1="0" y1="180" x2="410" y2="180" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="400" y="174" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">السطح الفاصل بين الوسطين</text>

      <!-- Medium 1 (Bottom): Glass/Water (n1 > n2) -->
      <rect x="0" y="180" width="410" height="180" fill="url(#glassDense)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="340" font-family="'Segoe UI', Cairo, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">الوسط ١: زجاج أو ماء ذو كثافة ضوئية أكبر (n₁)</text>

      <!-- Normal line (العمود المقاوم) -->
      <line x1="205" y1="15" x2="205" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="210" y="25" font-family="'Segoe UI', Cairo, sans-serif" font-size="10" fill="#94a3b8">العمود المقاوم</text>

      <!-- Light Source at bottom center S -->
      <circle cx="205" cy="330" r="6" fill="#facc15"/>
      <text x="205" y="352" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#facc15" text-anchor="middle">مصدر ضوئي (S)</text>

      <!-- Ray 1: Yellow (Normal Refraction: phi < phi_c) -->
      <!-- Incident Ray -->
      <line x1="205" y1="330" x2="150" y2="180" stroke="#facc15" stroke-width="2" marker-mid="url(#rayYellow)"/>
      <!-- Refracted Ray into air bending away -->
      <line x1="150" y1="180" x2="70" y2="40" stroke="#facc15" stroke-width="2" marker-end="url(#rayYellow)"/>
      <text x="65" y="30" class="label-ray" fill="#facc15">١. انكسار مبتعداً عن العمود</text>

      <!-- Ray 2: Green (Critical Angle: phi = phi_c, theta = 90) -->
      <line x1="205" y1="330" x2="205" y2="180" stroke="#34d399" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="205" y1="330" x2="280" y2="180" stroke="#34d399" stroke-width="2.5" marker-mid="url(#rayGreen)"/>
      <!-- Grazing Refracted Ray along boundary (90 deg) -->
      <line x1="280" y1="180" x2="395" y2="180" stroke="#34d399" stroke-width="3.5" marker-end="url(#rayGreen)"/>
      <text x="350" y="165" class="label-ray" fill="#34d399">٢. زاوية حرجة θ = 90°</text>

      <!-- Ray 3: Red (Total Internal Reflection: phi > phi_c) -->
      <line x1="205" y1="330" x2="330" y2="180" stroke="#ef4444" stroke-width="2.5"/>
      <!-- Completely reflected back into medium 1 -->
      <line x1="330" y1="180" x2="390" y2="280" stroke="#ef4444" stroke-width="2.5" marker-end="url(#rayRed)"/>
      <text x="370" y="300" class="label-ray" fill="#ef4444">٣. انعكاس كلي داخلي</text>
    </g>

    <!-- Bottom summary tag inside Left Panel -->
    <rect x="25" y="420" width="420" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="235" y="442" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">الانعكاس الكلي يحبس 100% من طاقة الضوء دون أي نفاذ للوسط الثاني</text>
  </g>

  <!-- Right Panel: Equations & Optical Fiber Applications -->
  <g transform="translate(520, 105)">
    <!-- Top Box: Laws & Formulas -->
    <g transform="translate(0, 0)">
      <rect width="370" height="225" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="185" y="28" class="card-title">قوانين الانكسار وحساب الزاوية الحرجة</text>

      <!-- Snell's Law -->
      <rect x="20" y="45" width="330" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="185" y="70" class="formula-bold" fill="#38bdf8">n₁ · sin(ϕ) = n₂ · sin(θ)</text>

      <!-- Critical Angle Formula -->
      <rect x="20" y="95" width="330" height="40" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="185" y="120" class="formula-bold" fill="#34d399">sin(ϕc) = n₂ / n₁ = 1 / n</text>

      <!-- Conditions for TIR -->
      <g transform="translate(20, 145)">
        <text x="330" y="18" class="body-desc" font-weight="bold" fill="#facc15" text-anchor="end">شرطا حدوث الانعكاس الكلي الداخلي:</text>
        <text x="330" y="38" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="end">١. انتقال الضوء من وسط أكبر كثافة ضوئية إلى وسط أقل.</text>
        <text x="330" y="56" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="end">٢. زاوية السقوط أكبر تماماً من الزاوية الحرجة (ϕ &gt; ϕc).</text>
      </g>
    </g>

    <!-- Bottom Box: Optical Fiber Cable Application -->
    <g transform="translate(0, 245)">
      <rect width="370" height="225" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="185" y="28" class="card-title">تطبيق تكنولوجي: كابل الألياف الضوئية (Optical Fiber)</text>

      <!-- Optical Fiber Cylinder Drawing -->
      <g transform="translate(25, 45)">
        <!-- Outer Cladding (غلاف منخفض الكثافة) -->
        <rect x="0" y="10" width="320" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <!-- Inner Core (قلب عالي الكثافة الضوئية) -->
        <rect x="0" y="25" width="320" height="40" fill="url(#fiberCore)" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>

        <!-- Light bouncing inside core by TIR -->
        <path d="M 0,45 L 60,26 L 140,64 L 220,26 L 300,64 L 320,45" fill="none" stroke="#facc15" stroke-width="3"/>
        <circle cx="60" cy="26" r="3" fill="#ffffff"/>
        <circle cx="140" cy="64" r="3" fill="#ffffff"/>
        <circle cx="220" cy="26" r="3" fill="#ffffff"/>
        <circle cx="300" cy="64" r="3" fill="#ffffff"/>
      </g>

      <!-- Optical Fiber Notes -->
      <g transform="translate(25, 135)">
        <text x="320" y="18" class="body-desc" text-anchor="end">✦ **القلب الزجاجي (Core):** معامل انكساره مرتفع (n₁ كبير).</text>
        <text x="320" y="38" class="body-desc" text-anchor="end">✦ **الغلاف الخارجي (Cladding):** معامل انكساره أقل (n₂ صغير).</text>
        <text x="320" y="58" class="body-desc" text-anchor="end">✦ يعاني الضوء انعكاسات كلية متتالية فينقل إشارات الإنترنت</text>
        <text x="320" y="76" class="body-desc" text-anchor="end">بسرعة الضوء وبدون أي فقد لمسافات تمتد لآلاف الكيلومترات.</text>
      </g>
    </g>
  </g>
</svg>
