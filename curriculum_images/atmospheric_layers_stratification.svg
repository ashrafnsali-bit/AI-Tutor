<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ozoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .layer-name { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; }
    .alt-badge { font-family: 'Consolas', 'Cairo', monospace; font-size: 12px; font-weight: bold; fill: #facc15; }
    .prop-text { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #e2e8f0; }
    .temp-text { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; font-weight: bold; fill: #f87171; }
  </style>

  <!-- Background Sky Gradient -->
  <rect width="960" height="640" rx="16" fill="url(#skyGrad)"/>
  <rect x="8" y="8" width="944" height="624" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4"/>

  <!-- Top Banner -->
  <rect x="25" y="16" width="910" height="60" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
  <text x="480" y="40" class="title-main">مخطط طبقات الغلاف الجوي المعتمد: الخصائص، الارتفاعات، وتدرج درجات الحرارة</text>
  <text x="480" y="60" class="subtitle">العلوم - المرحلة الإعدادية والمتوسطة • التروبوسفير، الستراتوسفير (الأوزون)، الميزوسفير (الشهب)، الثرموسفير (الأيونوسفير)</text>

  <!-- Layers Container (from bottom to top) -->
  <!-- Layer 1: Troposphere (0 to 13 km) -->
  <g transform="translate(40, 480)">
    <rect width="880" height="130" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="860" y="32" class="layer-name" text-anchor="end">١. التُّرُوبُوسْفِير (طبقة التقلبات الجوية والطقس)</text>
    <rect x="20" y="12" width="160" height="26" rx="6" fill="#0369a1"/>
    <text x="100" y="30" class="alt-badge" text-anchor="middle">الارتفاع: 0 ➔ 13 كم</text>
    <text x="860" y="60" class="prop-text" text-anchor="end">• تحتوي على ٧٥٪ من كتلة الغلاف الجوي، و٩٩٪ من بخار الماء (تتكون فيها السحب، الأمطار، والرياح).</text>
    <text x="860" y="82" class="prop-text" text-anchor="end">• حركة الهواء فيها رأسية (تصعد التيارات الساخنة وتهبط الباردة).</text>
    <text x="860" y="104" class="temp-text" text-anchor="end">🌡️ الحرارة: تنخفض بمعدل ٦.٥ °م لكل ١ كم ارتفاعاً حتى تصل إلى (-٦٠ °م) عند التروبوبوز.</text>
  </g>

  <!-- Layer 2: Stratosphere (13 to 50 km) -->
  <g transform="translate(40, 345)">
    <rect width="880" height="125" rx="8" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Ozone Layer Highlight -->
    <rect x="200" y="38" width="550" height="32" rx="6" fill="url(#ozoneGrad)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="475" y="60" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc" text-anchor="middle">🛡️ طبقة الأوزون الواقية (O₃) من ٢٠ إلى ٤٠ كم (تمتص الأشعة فوق البنفسجية الضارة UV-B)</text>
    <text x="860" y="28" class="layer-name" text-anchor="end">٢. السِّتْرَاتُوسْفِير (الغلاف الجوي الأوزوني والملاحة الجوية)</text>
    <rect x="20" y="10" width="160" height="26" rx="6" fill="#1d4ed8"/>
    <text x="100" y="28" class="alt-badge" text-anchor="middle">الارتفاع: 13 ➔ 50 كم</text>
    <text x="860" y="90" class="prop-text" text-anchor="end">• الجزء السفلي منها خالي من الغيوم والاضطرابات الجوية وحركة الهواء أفقية (مناسبة لطيران الطائرات النفاثة).</text>
    <text x="860" y="110" class="temp-text" text-anchor="end" fill="#38bdf8">🌡️ الحرارة: ترتفع تدريجياً من (-٦٠ °م) إلى (صفر مئوي) بسبب امتصاص الأوزون للأشعة فوق البنفسجية.</text>
  </g>

  <!-- Layer 3: Mesosphere (50 to 85 km) -->
  <g transform="translate(40, 215)">
    <rect width="880" height="120" rx="8" fill="#0f172a" fill-opacity="0.5" stroke="#818cf8" stroke-width="1.5"/>
    <text x="860" y="28" class="layer-name" text-anchor="end">٣. المِيزُوسْفِير (الغلاف الجوي الأوسط وحماية الأرض من الكتل الصخرية)</text>
    <rect x="20" y="10" width="160" height="26" rx="6" fill="#4338ca"/>
    <text x="100" y="28" class="alt-badge" text-anchor="middle">الارتفاع: 50 ➔ 85 كم</text>
    <text x="860" y="60" class="prop-text" text-anchor="end">• أبرد طبقات الغلاف الجوي على الإطلاق؛ طبقة مخلخلة تحتوي على كميات قليلة من غازي الهيليوم والهيدروجين.</text>
    <text x="860" y="82" class="prop-text" text-anchor="end" fill="#fde047">🌠 تحترق فيها الشهب تماماً نتيجة الاحتكاك بجزيئات الهواء وتظهر في السماء كسهام ضوئية لامعة.</text>
    <text x="860" y="104" class="temp-text" text-anchor="end" fill="#93c5fd">🌡️ الحرارة: تنخفض بشدة مع الارتفاع حتى تصل إلى (-٩٠ °م) عند الميزوبوز.</text>
  </g>

  <!-- Layer 4: Thermosphere & Exosphere (85 to 690 km) -->
  <g transform="translate(40, 85)">
    <rect width="880" height="120" rx="8" fill="#020617" fill-opacity="0.65" stroke="#a855f7" stroke-width="1.5"/>
    <text x="860" y="28" class="layer-name" text-anchor="end">٤. الثِّرْمُوسْفِير وَالأَيُونُوسْفِير (الطبقة الحرارية والاتصالات اللاسلكية)</text>
    <rect x="20" y="10" width="170" height="26" rx="6" fill="#6b21a8"/>
    <text x="105" y="28" class="alt-badge" text-anchor="middle">الارتفاع: 85 ➔ 690 كم</text>
    <text x="860" y="60" class="prop-text" text-anchor="end">• أسخن طبقات الغلاف الجوي؛ يحتوي جزؤها العلوي على (الأيونوسفير) المشحون كهربائياً لعكس موجات الراديو والاتصالات.</text>
    <text x="860" y="82" class="prop-text" text-anchor="end" fill="#c084fc">🌌 الشفق القطبي (الأورورا): ستائر ضوئية مبهرة تتكون بفعل حزامَيْ فان ألن المشحونين المغناطيسيين.</text>
    <text x="860" y="104" class="temp-text" text-anchor="end" fill="#f87171">🌡️ الحرارة: ترتفع بسرعة فائقة لتصل إلى (+١٢٠٠ °م) • يليها الإكسوسفير حيث تسبح الأقمار الصناعية.</text>
  </g>
</svg>
