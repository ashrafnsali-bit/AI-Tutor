<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Vessel Gradients -->
    <linearGradient id="arteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="kidneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="ureterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bladderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#ef4444" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="620" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="936" height="596" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- TOP HEADER -->
  <g id="headerGroup">
    <rect x="25" y="24" width="910" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="58" cy="56" r="20" fill="#0284c7" opacity="0.2"/>
    <path d="M 50 56 Q 58 46 66 56 Q 58 66 50 56 Z" fill="#38bdf8"/>
    
    <text x="95" y="48" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
      الجهاز البولي والإخراج في جسم الإنسان (Human Excretory &amp; Urinary System)
    </text>
    <text x="95" y="70" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
      مناهج العلوم الطبيعية المعتمدة: تشريح الكليتين، الأوعية الدموية، الحالبين، والمثانة مع آلية ترشيح النيفرون
    </text>
    <rect x="800" y="38" width="120" height="36" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="860" y="61" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      العلوم - الصف السادس
    </text>
  </g>

  <!-- LEFT PANEL: ANATOMY OF URINARY SYSTEM -->
  <g id="mainAnatomyGroup" transform="translate(30, 105)">
    <!-- Container Card -->
    <rect x="0" y="0" width="510" height="490" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <text x="255" y="32" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      أولاً: التركيب التشريحي للجهاز البولي (Anatomy)
    </text>

    <!-- Body Outline Background Hint -->
    <path d="M 120 70 Q 255 40 390 70 Q 380 300 370 450 Q 255 470 140 450 Z" fill="#1e293b" opacity="0.3"/>

    <!-- Aorta (Red Artery) & Vena Cava (Blue Vein) -->
    <!-- Inferior Vena Cava (Blue) -->
    <path d="M 235 60 L 235 430" stroke="url(#veinGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Abdominal Aorta (Red) -->
    <path d="M 275 60 L 275 430" stroke="url(#arteryGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Renal Arteries (Red to Kidneys) -->
    <!-- Left of image (Right Kidney) -->
    <path d="M 270 160 L 175 165" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <!-- Right of image (Left Kidney) -->
    <path d="M 275 150 L 335 155" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

    <!-- Renal Veins (Blue from Kidneys) -->
    <path d="M 175 180 L 240 175" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <path d="M 335 170 L 245 168" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>

    <!-- RIGHT KIDNEY (Left on diagram) -->
    <!-- Anatomically right kidney is slightly lower due to liver -->
    <g id="rightKidney">
      <path d="M 130 115 C 80 140 75 220 120 250 C 160 270 180 235 170 205 C 165 190 165 170 170 155 C 178 125 155 105 130 115 Z" 
            fill="url(#kidneyGrad)" stroke="#fda4af" stroke-width="2" filter="url(#softShadow)"/>
      <!-- Adrenal Gland -->
      <path d="M 115 118 C 125 102 145 102 150 115 Z" fill="#eab308" stroke="#fef08a" stroke-width="1"/>
    </g>

    <!-- LEFT KIDNEY (Right on diagram) -->
    <g id="leftKidney">
      <path d="M 380 100 C 430 125 435 205 390 235 C 350 255 330 220 340 190 C 345 175 345 155 340 140 C 332 110 355 90 380 100 Z" 
            fill="url(#kidneyGrad)" stroke="#fda4af" stroke-width="2" filter="url(#softShadow)"/>
      <!-- Adrenal Gland -->
      <path d="M 360 103 C 370 88 390 88 395 103 Z" fill="#eab308" stroke="#fef08a" stroke-width="1"/>
    </g>

    <!-- URETERS (Yellow/Amber tubes) -->
    <!-- Right Ureter -->
    <path d="M 160 215 Q 180 320 235 390" fill="none" stroke="url(#ureterGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Left Ureter -->
    <path d="M 350 200 Q 330 320 275 390" fill="none" stroke="url(#ureterGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- URINARY BLADDER (المثانة البولية) -->
    <g id="bladderGroup">
      <ellipse cx="255" cy="405" rx="46" ry="34" fill="url(#bladderGrad)" stroke="#fef08a" stroke-width="2" filter="url(#softShadow)"/>
      <ellipse cx="255" cy="405" rx="36" ry="24" fill="#d97706" opacity="0.6"/>
      <!-- Urethra (مجرى البول) -->
      <path d="M 255 438 L 255 470" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- LABELS & CALLOUTS -->
    <!-- Label: Right Kidney -->
    <line x1="85" y1="180" x2="25" y2="180" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3"/>
    <rect x="15" y="155" width="95" height="32" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="62" y="174" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fda4af" text-anchor="middle">الكلية اليمنى</text>

    <!-- Label: Left Kidney -->
    <line x1="420" y1="165" x2="480" y2="165" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3"/>
    <rect x="400" y="145" width="95" height="32" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="447" y="165" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fda4af" text-anchor="middle">الكلية اليسرى</text>

    <!-- Label: Renal Artery & Vein -->
    <line x1="285" y1="110" x2="330" y2="85" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="290" y="65" width="110" height="26" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="345" y="82" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">شريان كلوي (محمل بالدم)</text>

    <line x1="225" y1="110" x2="180" y2="85" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="110" y="65" width="110" height="26" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text x="165" y="82" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">وريد كلوي (دم مصفى)</text>

    <!-- Label: Ureters (الحالبان) -->
    <line x1="175" y1="310" x2="90" y2="310" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="295" width="100" height="32" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="65" y="315" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">الحالب (ينقل البول)</text>

    <!-- Label: Bladder (المثانة) -->
    <line x1="305" y1="410" x2="370" y2="410" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="370" y="395" width="125" height="32" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="432" y="415" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">المثانة (تخزين البول)</text>

    <!-- Label: Urethra (مجرى البول) -->
    <line x1="260" y1="455" x2="330" y2="455" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="330" y="440" width="115" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="387" y="458" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">القناة ومجرى البول</text>
  </g>

  <!-- RIGHT PANEL: NEPHRON & FILTRATION MECHANISM -->
  <g id="nephronGroup" transform="translate(560, 105)">
    <!-- Container Card -->
    <rect x="0" y="0" width="370" height="490" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="185" y="32" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">
      ثانياً: وحدة التنقية المجهرية (النيفرون Nephron)
    </text>

    <!-- Microscopic Inset Box -->
    <rect x="20" y="50" width="330" height="235" rx="12" fill="#0b1329" stroke="#10b981" stroke-width="1.2"/>

    <!-- Bowman's Capsule & Glomerulus (محفظة بومان والكتلة الشعرية) -->
    <g id="bowmanGlomerulus" transform="translate(45, 75)">
      <!-- Bowman's Capsule (C-shape cup) -->
      <path d="M 40 40 C 15 50 15 110 40 120 C 60 125 70 115 70 95 L 110 95" 
            fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
      <path d="M 40 40 C 25 50 25 110 40 120 C 50 125 55 115 55 95 L 110 95" 
            fill="none" stroke="#0b1329" stroke-width="4"/>
      
      <!-- Afferent Artery (Entering) -->
      <path d="M 2 20 Q 25 25 35 60" stroke="#ef4444" stroke-width="6" fill="none" marker-end="url(#arrowRed)"/>
      <text x="2" y="15" font-family="'Cairo', sans-serif" font-size="9" fill="#fca5a5">شريان وارد (دم غير مصفى)</text>

      <!-- Glomerulus Capillary Tuft (الكبيبة) -->
      <path d="M 35 60 Q 55 45 45 75 Q 30 85 50 90 Q 60 65 35 80" stroke="#f43f5e" stroke-width="3.5" fill="none"/>

      <!-- Efferent Artery (Exiting) -->
      <path d="M 45 70 Q 55 40 90 30" stroke="#ef4444" stroke-width="4" fill="none"/>
      <text x="85" y="24" font-family="'Cairo', sans-serif" font-size="9" fill="#fca5a5">شريان صادر</text>

      <!-- Tubule & Henle Loop Representation -->
      <path d="M 110 95 Q 160 95 160 140 Q 160 190 190 190 Q 220 190 220 120 L 250 120" 
            fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Collecting Duct (القناة الجامعة) -->
      <path d="M 250 80 L 250 200" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
      <text x="260" y="185" font-family="'Cairo', sans-serif" font-size="10" font-weight="bold" fill="#fef08a">إلى الحالب</text>

      <!-- Labels inside inset -->
      <text x="50" y="145" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#fef08a">محفظة بومان والكبيبة</text>
      <text x="50" y="160" font-family="'Cairo', sans-serif" font-size="9.5" fill="#94a3b8">أكثر من مليون نيفرون بكل كلية</text>
    </g>

    <!-- 3 STEPS SUMMARY CARDS -->
    <g id="stepsSummary" transform="translate(20, 295)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="330" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="24" cy="26" r="14" fill="#0284c7"/>
      <text x="24" y="31" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
      <text x="48" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">مرحلة الترشيح الفائق (Filtration):</text>
      <text x="48" y="40" font-family="'Cairo', sans-serif" font-size="10.5" fill="#cbd5e1">ترشيح الماء والأملاح واليوريا وسكر الجلوكوز من الدم داخل المحفظة.</text>

      <!-- Step 2 -->
      <rect x="0" y="60" width="330" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <circle cx="24" cy="86" r="14" fill="#059669"/>
      <text x="24" y="91" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
      <text x="48" y="82" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#10b981">مرحلة إعادة الامتصاص الاختياري:</text>
      <text x="48" y="100" font-family="'Cairo', sans-serif" font-size="10.5" fill="#cbd5e1">استرجاع كل الجلوكوز والماء والأملاح التي يحتاجها الجسم إلى الدم ثانية.</text>

      <!-- Step 3 -->
      <rect x="0" y="120" width="330" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="24" cy="148" r="14" fill="#d97706"/>
      <text x="24" y="153" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
      <text x="48" y="142" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">تكوين البول وإفراز الفضلات:</text>
      <text x="48" y="160" font-family="'Cairo', sans-serif" font-size="10.5" fill="#cbd5e1">تجميع الفضلات النيتروجينية السامة والماء الزائد وطردها عبر الحالبين.</text>
    </g>
  </g>
</svg>
