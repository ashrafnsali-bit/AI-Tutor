<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <marker id="arrowAxis" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .formula-badge { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #facc15; text-anchor: middle; }
    .label-tag { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    .body-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .grid-num { font-family: 'Consolas', monospace; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="860" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="50" class="title-main">مخطط قوانين حجم المجسمات وشبكة المستوى الإحداثي</text>
  <text x="460" y="72" class="subtitle">Math Grade 5: 3D Prisms / Cubes Volume &amp; 2D Coordinate Grid Ordered Pairs</text>

  <!-- Left Panel: 3D Volume Models (Prism & Cube) -->
  <g transform="translate(30, 105)">
    <rect width="425" height="470" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="212" y="30" class="card-title">قوانين حجم المجسمات ثلاثية الأبعاد</text>

    <!-- 1. Rectangular Prism (متوازي المستطيلات) -->
    <g transform="translate(20, 50)">
      <rect width="385" height="195" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="192" y="24" class="label-tag" fill="#38bdf8" text-anchor="middle">١. متوازي المستطيلات (Rectangular Prism)</text>

      <!-- Isometric 3D Prism Illustration -->
      <g transform="translate(30, 45)">
        <!-- Front face -->
        <rect x="0" y="30" width="110" height="60" fill="url(#prismGrad)" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
        <!-- Top face -->
        <polygon points="0,30 35,0 145,0 110,30" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
        <!-- Side face -->
        <polygon points="110,30 145,0 145,60 110,90" fill="#0284c7" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
        <!-- Dimension Labels -->
        <text x="55" y="105" font-family="'Segoe UI', sans-serif" font-size="11" fill="#facc15" text-anchor="middle">الطول (L)</text>
        <text x="135" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#facc15">العرض (W)</text>
        <text x="-5" y="65" font-family="'Segoe UI', sans-serif" font-size="11" fill="#facc15" text-anchor="end">الارتفاع (H)</text>
      </g>

      <!-- Formulas for Prism -->
      <g transform="translate(195, 45)">
        <rect width="175" height="35" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
        <text x="87" y="23" class="formula-badge">V = L × W × H</text>
        
        <rect y="45" width="175" height="35" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
        <text x="87" y="68" class="formula-badge">V = مساحة القاعدة × H</text>

        <text x="87" y="102" class="body-desc" text-anchor="middle">يقاس بالسنتيمتر المكعب (سم³)</text>
      </g>
    </g>

    <!-- 2. Cube (المكعب) -->
    <g transform="translate(20, 260)">
      <rect width="385" height="190" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="192" y="24" class="label-tag" fill="#34d399" text-anchor="middle">٢. المكعب (جميع الأحرف متساوية s)</text>

      <!-- Isometric 3D Cube Illustration -->
      <g transform="translate(45, 45)">
        <!-- Front face -->
        <rect x="0" y="25" width="75" height="75" fill="url(#cubeGrad)" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5"/>
        <!-- Top face -->
        <polygon points="0,25 25,0 100,0 75,25" fill="#34d399" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5"/>
        <!-- Side face -->
        <polygon points="75,25 100,0 100,75 75,100" fill="#059669" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
        <!-- Dimension Labels -->
        <text x="37" y="115" font-family="'Segoe UI', sans-serif" font-size="11" fill="#facc15" text-anchor="middle">طول الحرف (s)</text>
      </g>

      <!-- Formulas for Cube -->
      <g transform="translate(195, 45)">
        <rect width="175" height="35" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
        <text x="87" y="23" class="formula-badge" fill="#34d399">V = s × s × s</text>
        
        <rect y="45" width="175" height="35" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
        <text x="87" y="68" class="formula-badge" fill="#34d399">V = s³ (طول الحرف³)</text>

        <text x="87" y="102" class="body-desc" text-anchor="middle">مكعب طول حرفه 4 سم ➔ 64 سم³</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: Coordinate Plane & Ordered Pairs -->
  <g transform="translate(475, 105)">
    <rect width="415" height="470" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="207" y="30" class="card-title">المستوى الإحداثي وتمثيل الأزواج المرتبة (x, y)</text>

    <!-- Coordinate Grid (0 to 6 on X and Y) -->
    <g transform="translate(55, 290)">
      <!-- Grid Lines -->
      <line x1="0" y1="0" x2="310" y2="0" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="-45" x2="310" y2="-45" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="-90" x2="310" y2="-90" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="-135" x2="310" y2="-135" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="-180" x2="310" y2="-180" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="-225" x2="310" y2="-225" stroke="#334155" stroke-width="1"/>

      <line x1="45" y1="0" x2="45" y2="-230" stroke="#334155" stroke-width="1"/>
      <line x1="90" y1="0" x2="90" y2="-230" stroke="#334155" stroke-width="1"/>
      <line x1="135" y1="0" x2="135" y2="-230" stroke="#334155" stroke-width="1"/>
      <line x1="180" y1="0" x2="180" y2="-230" stroke="#334155" stroke-width="1"/>
      <line x1="225" y1="0" x2="225" y2="-230" stroke="#334155" stroke-width="1"/>
      <line x1="270" y1="0" x2="270" y2="-230" stroke="#334155" stroke-width="1"/>

      <!-- X Axis -->
      <line x1="-10" y1="0" x2="320" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowAxis)"/>
      <text x="325" y="4" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">X</text>
      <!-- Y Axis -->
      <line x1="0" y1="10" x2="0" y2="-240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowAxis)"/>
      <text x="0" y="-248" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Y</text>

      <!-- Tick Numbers on X -->
      <text x="0" y="16" class="grid-num">0</text>
      <text x="45" y="16" class="grid-num">1</text>
      <text x="90" y="16" class="grid-num">2</text>
      <text x="135" y="16" class="grid-num">3</text>
      <text x="180" y="16" class="grid-num">4</text>
      <text x="225" y="16" class="grid-num">5</text>
      <text x="270" y="16" class="grid-num">6</text>

      <!-- Tick Numbers on Y -->
      <text x="-12" y="-42" class="grid-num">1</text>
      <text x="-12" y="-87" class="grid-num">2</text>
      <text x="-12" y="-132" class="grid-num">3</text>
      <text x="-12" y="-177" class="grid-num">4</text>
      <text x="-12" y="-222" class="grid-num">5</text>

      <!-- Plot Point A(2, 3) -->
      <!-- Step arrows from origin: 0 -> 2 along X, then 2 -> 3 along Y -->
      <path d="M 0,0 L 90,0 L 90,-135" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="90" cy="-135" r="5" fill="#facc15"/>
      <text x="100" y="-142" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#facc15">A(2, 3)</text>

      <!-- Plot Point B(5, 1) -->
      <path d="M 0,0 L 225,0 L 225,-45" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="225" cy="-45" r="5" fill="#34d399"/>
      <text x="235" y="-52" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#34d399">B(5, 1)</text>

      <!-- Plot Point C(4, 4) -->
      <circle cx="180" cy="-180" r="5" fill="#f43f5e"/>
      <text x="190" y="-188" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#f43f5e">C(4, 4)</text>
    </g>

    <!-- Bottom Explanatory Box on Right Panel -->
    <g transform="translate(20, 340)">
      <rect width="375" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="187" y="24" font-family="'Segoe UI', Cairo, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">قاعدة قراءة وتمثيل الزوج المرتب (x, y)</text>
      <text x="355" y="52" class="body-desc" text-anchor="end">١. نبدأ دائماً من **نقطة الأصل (0، 0)**.</text>
      <text x="355" y="74" class="body-desc" text-anchor="end">٢. نتحرك أفقياً يميناً على محور **X** بمقدار العدد الأول.</text>
      <text x="355" y="96" class="body-desc" text-anchor="end">٣. نصعد رأسياً لأعلى على محور **Y** بمقدار العدد الثاني ونضع النقطة.</text>
    </g>
  </g>
</svg>
