<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Marker arrows -->
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#facc15"/>
    </marker>
    <marker id="arrowAxis" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .formula-bold { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #f8fafc; }
    .label-axis { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #94a3b8; }
    .math-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="860" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="50" class="title-main">مخطط تحليل المتجهات إلى مركبتين متعامدتين والضرب القياسي والاتجاهي</text>
  <text x="460" y="72" class="subtitle">Physics Grade 10: Vector Resolution (Ax, Ay) &amp; Dot / Cross Products</text>

  <!-- Left Panel: 2D Vector Resolution Graph -->
  <g transform="translate(35, 105)">
    <rect width="430" height="470" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="215" y="32" class="card-title">تحليل المتجه في المستوى الإحداثي متعامد الأبعاد</text>

    <!-- Coordinate Grid & Axes -->
    <g transform="translate(60, 290)">
      <!-- Grid lines -->
      <line x1="0" y1="-210" x2="310" y2="-210" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="-140" x2="310" y2="-140" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="-70" x2="310" y2="-70" stroke="#1e293b" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="-220" stroke="#1e293b" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="-220" stroke="#1e293b" stroke-width="1"/>
      <line x1="300" y1="0" x2="300" y2="-220" stroke="#1e293b" stroke-width="1"/>

      <!-- X Axis -->
      <line x1="-15" y1="0" x2="330" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrowAxis)"/>
      <text x="335" y="5" class="label-axis">+X (الأفقي)</text>
      <!-- Y Axis -->
      <line x1="0" y1="15" x2="0" y2="-230" stroke="#64748b" stroke-width="2" marker-end="url(#arrowAxis)"/>
      <text x="-5" y="-235" class="label-axis" text-anchor="middle">+Y (الرأسي)</text>

      <!-- Origin O (0,0) -->
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <text x="-12" y="18" font-family="'Segoe UI', Cairo, sans-serif" font-size="12" fill="#94a3b8">O</text>

      <!-- Vector A: (0,0) to (240, -160) -->
      <!-- Angle Arc -->
      <path d="M 50,0 A 50,50 0 0,0 41.6,-27.7" fill="none" stroke="#facc15" stroke-width="2"/>
      <text x="60" y="-12" font-family="'Segoe UI', Cairo, sans-serif" font-size="14" font-weight="bold" fill="#facc15">θ</text>

      <!-- Component Ax (on X axis) -->
      <line x1="0" y1="0" x2="232" y2="0" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
      <text x="110" y="22" font-family="'Segoe UI', Cairo, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Ax = A · cos(θ)</text>

      <!-- Component Ay (on Y axis) -->
      <line x1="0" y1="0" x2="0" y2="-152" stroke="#10b981" stroke-width="4" marker-end="url(#arrowGreen)"/>
      <text x="-15" y="-80" font-family="'Segoe UI', Cairo, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="end">Ay = A · sin(θ)</text>

      <!-- Dashed projection lines -->
      <line x1="240" y1="0" x2="240" y2="-160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="0" y1="-160" x2="240" y2="-160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Vector A (Resultant hypotenuse) -->
      <line x1="0" y1="0" x2="234" y2="-156" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
      <text x="115" y="-95" font-family="'Segoe UI', Cairo, sans-serif" font-size="16" font-weight="bold" fill="#ef4444">المتجه A (المحصل)</text>
    </g>

    <!-- Formula Box bottom of Left Panel -->
    <g transform="translate(20, 340)">
      <rect width="390" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="195" y="25" font-family="'Segoe UI', Cairo, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">قوانين التحليل ونظرية فيثاغورس</text>
      
      <text x="25" y="55" class="formula-bold" fill="#facc15">A = √(Ax² + Ay²)</text>
      <text x="365" y="55" class="math-text" text-anchor="end">✦ حساب مقدار المتجه</text>

      <text x="25" y="85" class="formula-bold" fill="#38bdf8">tan(θ) = Ay / Ax</text>
      <text x="365" y="85" class="math-text" text-anchor="end">✦ تحديد زاوية الاتجاه</text>
    </g>
  </g>

  <!-- Right Panel: Dot & Cross Product Comparison -->
  <g transform="translate(485, 105)">
    <rect width="400" height="470" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="200" y="32" class="card-title">مقارنة الضرب القياسي (العددي) والضرب الاتجاهي</text>

    <!-- Top Card: Dot Product (A · B) -->
    <g transform="translate(20, 50)">
      <rect width="360" height="190" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="180" y="28" font-family="'Segoe UI', Cairo, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">١. الضرب القياسي (العددي) Dot Product</text>
      
      <!-- Formula Display -->
      <rect x="25" y="42" width="310" height="40" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="180" y="68" font-family="'Consolas', monospace" font-size="17" font-weight="bold" fill="#38bdf8" text-anchor="middle">A · B = |A| |B| cos(θ)</text>

      <!-- Geometry Mini-sketch -->
      <g transform="translate(40, 150)">
        <line x1="0" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
        <text x="125" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">B</text>
        <line x1="0" y1="0" x2="90" y2="-35" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
        <text x="95" y="-35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ef4444">A</text>
        <path d="M 30,0 A 30,30 0 0,0 27,-10" fill="none" stroke="#facc15" stroke-width="1.5"/>
        <text x="35" y="-5" font-family="'Segoe UI', sans-serif" font-size="11" fill="#facc15">θ</text>
      </g>

      <!-- Notes -->
      <text x="175" y="115" class="math-text">✦ الناتج: كمية قياسية (مقدار فقط دون اتجاه).</text>
      <text x="175" y="135" class="math-text">✦ أقصى قيمة: عندما θ = 0° (متوازيان cos 0 = 1).</text>
      <text x="175" y="155" class="math-text">✦ ينعدم: عندما θ = 90° (متعامدان cos 90 = 0).</text>
    </g>

    <!-- Bottom Card: Cross Product (A × B) -->
    <g transform="translate(20, 255)">
      <rect width="360" height="195" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="180" y="28" font-family="'Segoe UI', Cairo, sans-serif" font-size="15" font-weight="bold" fill="#f43f5e" text-anchor="middle">٢. الضرب الاتجاهي Cross Product</text>

      <!-- Formula Display -->
      <rect x="25" y="42" width="310" height="40" rx="6" fill="#0f172a" stroke="#e11d48" stroke-width="1"/>
      <text x="180" y="68" font-family="'Consolas', monospace" font-size="17" font-weight="bold" fill="#f43f5e" text-anchor="middle">A × B = |A| |B| sin(θ) · n̂</text>

      <!-- Geometry Mini-sketch -->
      <g transform="translate(40, 160)">
        <line x1="0" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
        <text x="115" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">B</text>
        <line x1="0" y1="0" x2="80" y2="-25" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
        <text x="85" y="-25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ef4444">A</text>
        <!-- Normal Vector n -->
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#facc15" stroke-width="3" marker-end="url(#arrowYellow)"/>
        <text x="5" y="-45" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#facc15">n̂ (عمودي)</text>
      </g>

      <!-- Notes -->
      <text x="165" y="115" class="math-text">✦ الناتج: كمية متجهة عمودية على مستواهما.</text>
      <text x="165" y="135" class="math-text">✦ يحدد الاتجاه: قاعدة اليد اليمنى (Right Hand).</text>
      <text x="165" y="155" class="math-text">✦ أقصى قيمة: عند التعامد θ = 90° (sin 90 = 1).</text>
      <text x="165" y="175" class="math-text">✦ ينعدم: عند التوازي θ = 0° (sin 0 = 0).</text>
    </g>
  </g>
</svg>
