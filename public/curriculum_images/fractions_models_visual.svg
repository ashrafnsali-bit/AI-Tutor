<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="barWhole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="barHalf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="barQuarter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barEighth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .section-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .label-bold { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .label-small { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
    .math-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; text-anchor: middle; }
    .note-text { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="900" height="580" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="880" height="560" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="24" width="840" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="52" class="title-text">نماذج الكسور الاعتيادية والكسور المتكافئة</text>
  <text x="450" y="72" class="subtitle-text">الصف الخامس الابتدائي - مفهوم الكسر كجزء من الكل والمقارنة والتحويل العشري والنسبي</text>

  <!-- Left Card: Circular Models & Percentages -->
  <g transform="translate(480, 100)">
    <rect width="390" height="450" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="195" y="32" class="section-title">النماذج الدائرية والتكافؤ المئوي والعشري</text>

    <!-- Circle 1: 1/2 -->
    <g transform="translate(100, 110)">
      <circle r="45" fill="#334155"/>
      <!-- Semi-circle right side -->
      <path d="M 0,-45 A 45,45 0 0,1 0,45 Z" fill="#10b981"/>
      <circle r="45" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="0" y="65" class="math-text">١/٢ (نصف)</text>
      <text x="0" y="82" class="label-small" fill="#34d399">0.5 = 50%</text>
    </g>

    <!-- Circle 2: 1/4 -->
    <g transform="translate(290, 110)">
      <circle r="45" fill="#334155"/>
      <!-- 90 deg quadrant (0 to 90) -->
      <path d="M 0,-45 A 45,45 0 0,1 45,0 L 0,0 Z" fill="#f59e0b"/>
      <circle r="45" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="0" y="65" class="math-text">١/٤ (ربع)</text>
      <text x="0" y="82" class="label-small" fill="#fbbf24">0.25 = 25%</text>
    </g>

    <!-- Circle 3: 3/4 -->
    <g transform="translate(100, 260)">
      <circle r="45" fill="#334155"/>
      <!-- 270 deg sector -->
      <path d="M 0,-45 A 45,45 0 1,1 -45,0 L 0,0 Z" fill="#ec4899"/>
      <circle r="45" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="0" y="65" class="math-text">٣/٤ (ثلاثة أرباع)</text>
      <text x="0" y="82" class="label-small" fill="#f472b6">0.75 = 75%</text>
    </g>

    <!-- Circle 4: 1/8 -->
    <g transform="translate(290, 260)">
      <circle r="45" fill="#334155"/>
      <!-- 45 deg sector: from 0,-45 to ~31.8,-31.8 -->
      <path d="M 0,-45 A 45,45 0 0,1 31.8,-31.8 L 0,0 Z" fill="#8b5cf6"/>
      <circle r="45" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="0" y="65" class="math-text">١/٨ (ثمن)</text>
      <text x="0" y="82" class="label-small" fill="#a78bfa">0.125 = 12.5%</text>
    </g>

    <!-- Rule Box inside Left Card -->
    <rect x="20" y="370" width="350" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="175" y="394" class="label-bold" fill="#38bdf8">قاعدة التكافؤ الذهبية</text>
    <text x="175" y="415" class="label-small" fill="#e2e8f0">ضرب أو قسمة البسط والمقام في نفس العدد ينتج كسراً مكافئاً</text>
  </g>

  <!-- Right Card: Fraction Bars (Wall of Fractions) -->
  <g transform="translate(30, 100)">
    <rect width="430" height="450" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="215" y="32" class="section-title">حائط الكسور المتكافئة (أشرطة الكسور)</text>

    <!-- 1 Whole Bar -->
    <g transform="translate(25, 55)">
      <rect width="380" height="42" rx="6" fill="url(#barWhole)" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="190" y="27" class="label-bold">١ واحد صحيح (1 Whole = 100%)</text>
    </g>

    <!-- 1/2 Bars -->
    <g transform="translate(25, 110)">
      <rect x="0" width="188" height="42" rx="6" fill="url(#barHalf)" stroke="#34d399" stroke-width="1.5"/>
      <text x="94" y="26" class="label-bold">١/٢ (نصف)</text>
      
      <rect x="192" width="188" height="42" rx="6" fill="url(#barHalf)" stroke="#34d399" stroke-width="1.5"/>
      <text x="286" y="26" class="label-bold">١/٢ (نصف)</text>
    </g>

    <!-- 1/4 Bars -->
    <g transform="translate(25, 165)">
      <rect x="0" width="92" height="42" rx="5" fill="url(#barQuarter)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="46" y="26" class="label-bold">١/٤</text>
      
      <rect x="96" width="92" height="42" rx="5" fill="url(#barQuarter)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="142" y="26" class="label-bold">١/٤</text>

      <rect x="192" width="92" height="42" rx="5" fill="url(#barQuarter)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="238" y="26" class="label-bold">١/٤</text>

      <rect x="288" width="92" height="42" rx="5" fill="url(#barQuarter)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="334" y="26" class="label-bold">١/٤</text>
    </g>

    <!-- 1/8 Bars -->
    <g transform="translate(25, 220)">
      <rect x="0" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="22.5" y="24" class="label-small">١/٨</text>

      <rect x="47.5" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="70" y="24" class="label-small">١/٨</text>

      <rect x="95" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="117.5" y="24" class="label-small">١/٨</text>

      <rect x="142.5" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="165" y="24" class="label-small">١/٨</text>

      <rect x="190" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="212.5" y="24" class="label-small">١/٨</text>

      <rect x="237.5" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="260" y="24" class="label-small">١/٨</text>

      <rect x="285" width="45" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="307.5" y="24" class="label-small">١/٨</text>

      <rect x="332.5" width="47.5" height="38" rx="4" fill="url(#barEighth)" stroke="#a78bfa" stroke-width="1"/>
      <text x="356" y="24" class="label-small">١/٨</text>
    </g>

    <!-- Mathematical Equivalence Chain Box -->
    <g transform="translate(25, 275)">
      <rect width="380" height="155" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="190" y="28" class="section-title" fill="#38bdf8">سلسلة الكسور المتكافئة</text>
      
      <!-- Equation display -->
      <text x="190" y="65" class="title-text" fill="#facc15">١/٢ = ٢/٤ = ٤/٨ = ٥/١٠</text>
      
      <line x1="20" y1="85" x2="360" y2="85" stroke="#334155" stroke-dasharray="4,4"/>
      
      <!-- Explanatory points -->
      <text x="360" y="110" class="note-text" text-anchor="end">✦ النصف يساوي ربعين، ويساوي أربعة أثمان</text>
      <text x="360" y="132" class="note-text" text-anchor="end">✦ عند توحيد المقامات نقوم بضرب البسط والمقام</text>
    </g>
  </g>
</svg>
