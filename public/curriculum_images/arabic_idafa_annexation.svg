<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .card-title { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
    .example-term { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #facc15; text-anchor: middle; }
    .label-bold { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
    .body-desc { font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .math-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #f8fafc; }
  </style>

  <!-- Background -->
  <rect width="920" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="900" height="580" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="860" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="50" class="title-main">مخطط التركيب الإضافي المعتمد: المضاف والمضاف إليه وعلامات الجر</text>
  <text x="460" y="72" class="subtitle">الصف الخامس الابتدائي - لغتي الجميلة: إزالة الإبهام، علامات الجر، وضوابط حذف التنوين والنون</text>

  <!-- Top Large Equation: Structure of Idafa -->
  <g transform="translate(30, 105)">
    <rect width="860" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="430" y="28" class="card-title">معادلة التركيب الإضافي (إزالة الإبهام والتخصيص)</text>

    <!-- Box 1: Mudaf -->
    <g transform="translate(180, 48)">
      <rect width="210" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="30" class="label-bold" fill="#38bdf8" text-anchor="middle">المُضَاف (اسم نكرة)</text>
      <text x="105" y="52" class="body-desc" text-anchor="middle">يعرب حسب موقعه في الجملة</text>
      <text x="105" y="68" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#f87171" text-anchor="middle">⚠️ لا ينون ولا تلحقه نون</text>
    </g>

    <!-- Plus Sign -->
    <text x="430" y="94" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#facc15" text-anchor="middle">+</text>

    <!-- Box 2: Mudaf Ilayhi -->
    <g transform="translate(470, 48)">
      <rect width="210" height="75" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="105" y="30" class="label-bold" fill="#34d399" text-anchor="middle">المُضَاف إِلَيْهِ (اسم معرفة)</text>
      <text x="105" y="52" class="body-desc" text-anchor="middle">يزيل إبهام المضاف ويخصصه</text>
      <text x="105" y="68" font-family="'Segoe UI', Cairo, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">✓ مجرور دائماً (بالكسرة أو الياء)</text>
    </g>
  </g>

  <!-- Bottom Panel: 2 Columns (Markers + Drop Rules) -->
  <g transform="translate(30, 275)">
    <!-- Column 1: Genitive Markers (علامات إعراب المضاف إليه) -->
    <g transform="translate(0, 0)">
      <rect width="420" height="300" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="210" y="30" class="card-title">علامات جر المضاف إليه (دائماً مجرور)</text>

      <!-- Marker 1: Kasra -->
      <g transform="translate(20, 50)">
        <rect width="380" height="100" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
        <circle cx="35" cy="50" r="16" fill="#059669"/>
        <text x="35" y="56" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">١</text>
        <text x="65" y="30" class="label-bold" fill="#34d399">الكسرة (علامة أصلية):</text>
        <text x="65" y="52" class="body-desc">✦ **المفرد:** قرأتُ غلافَ **الكتابِ**.</text>
        <text x="65" y="70" class="body-desc">✦ **جمع التكسير:** تكريمُ **العلماءِ** فخرٌ للوطن.</text>
        <text x="65" y="88" class="body-desc">✦ **جمع المؤنث السالم:** صوتُ **المعلماتِ** واضحٌ.</text>
      </g>

      <!-- Marker 2: Yaa -->
      <g transform="translate(20, 165)">
        <rect width="380" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="35" cy="57" r="16" fill="#0284c7"/>
        <text x="35" y="63" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">٢</text>
        <text x="65" y="28" class="label-bold" fill="#38bdf8">الياء (علامة فرعية):</text>
        <text x="65" y="50" class="body-desc">✦ **المثنى:** جائزةُ **الطالبَيْنِ** مستحقةٌ.</text>
        <text x="65" y="70" class="body-desc">✦ **جمع المذكر السالم:** جهودُ **المخلصِينَ** مشكورةٌ.</text>
        <text x="65" y="90" class="body-desc">✦ **الأسماء الخمسة:** نصيحةُ **أبيكَ** غاليةٌ.</text>
      </g>
    </g>

    <!-- Column 2: The Golden Rules of Deletion (حذف التنوين والنون) -->
    <g transform="translate(440, 0)">
      <rect width="420" height="300" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="210" y="30" class="card-title">القواعد الذهبية لحذف التنوين ونون التثنية والجمع</text>

      <!-- Rule 1: Nunation Drop -->
      <g transform="translate(20, 50)">
        <rect width="380" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="190" y="28" class="label-bold" fill="#fbbf24" text-anchor="middle">١. حذف التنوين عند الإضافة</text>
        <text x="190" y="52" class="body-desc" text-anchor="middle">لا يجتمع التنوين مع الإضافة أبداً في كلمة واحدة!</text>
        <rect x="30" y="62" width="320" height="28" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="1"/>
        <text x="190" y="81" class="example-term">كتابٌ + النحو = كتابُ النحوِ</text>
      </g>

      <!-- Rule 2: Noon Drop -->
      <g transform="translate(20, 165)">
        <rect width="380" height="115" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
        <text x="190" y="28" class="label-bold" fill="#f43f5e" text-anchor="middle">٢. حذف نون المثنى وجمع المذكر السالم</text>
        <text x="190" y="48" class="body-desc" text-anchor="middle">تحذف النون من المضاف تخفيفاً عند اتصاله بالمضاف إليه:</text>
        
        <rect x="25" y="56" width="330" height="24" rx="4" fill="#0f172a"/>
        <text x="190" y="73" font-family="'Segoe UI', Cairo, sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">مهندسانِ + المشروع = **مهندسا** المشروعِ</text>

        <rect x="25" y="84" width="330" height="24" rx="4" fill="#0f172a"/>
        <text x="190" y="101" font-family="'Segoe UI', Cairo, sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">معلمونَ + المدرسة = **معلمو** المدرسةِ</text>
      </g>
    </g>
  </g>
</svg>
