<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="100%" height="100%">
  <defs>
    <linearGradient id="arabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#162035"/>
    </linearGradient>

    <linearGradient id="cardGradArab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="arabShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .ar-title { font-family: 'Cairo', 'Traditional Arabic', 'Segoe UI', serif; font-weight: 800; fill: #f8fafc; }
    .ar-sub { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #94a3b8; }
    .card-head { font-family: 'Cairo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 16px; }
    .body-ar { font-family: 'Cairo', 'Traditional Arabic', serif; font-size: 14px; fill: #e2e8f0; }
    .word-bold { font-family: 'Cairo', 'Traditional Arabic', serif; font-weight: bold; font-size: 15px; }
    .badge-txt { font-family: 'Cairo', 'Segoe UI', sans-serif; font-weight: bold; font-size: 11px; }
  </style>

  <!-- Background -->
  <rect width="980" height="640" fill="url(#arabBg)" rx="16"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 22)">
    <rect width="900" height="66" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#arabShadow)"/>
    <rect x="888" y="0" width="12" height="66" rx="6" fill="#818cf8"/>
    
    <text x="860" y="30" class="ar-title" font-size="22" text-anchor="end">الميزان الصرفي والمجرد والمزيد من الأفعال — لغة عربية الصف الثاني الإعدادي</text>
    <text x="860" y="52" class="ar-sub" font-size="13" text-anchor="end">أصل الوزن (فَـ ـعَـ ـلَ)، حروف الزيادة (سألتمونيها)، أوزان المجرد والرباعي، وحالات الحذف من الميزان</text>
    
    <rect x="25" y="17" width="130" height="32" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="90" y="38" class="ar-title" font-size="12" fill="#c7d2fe" text-anchor="middle">علم الصرف والنحو</text>
  </g>

  <!-- Left: Visual Balance Scale of Sarf (ميزان الكلمة) -->
  <g transform="translate(40, 102)" filter="url(#arabShadow)">
    <rect width="430" height="514" rx="14" fill="url(#cardGradArab)" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 416 0 Q 430 0 430 14 L 430 36 L 0 36 Z" fill="#b45309" fill-opacity="0.3"/>
    
    <circle cx="408" cy="18" r="8" fill="#f59e0b"/>
    <text x="408" y="23" class="ar-title" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <text x="390" y="24" class="card-head" fill="#fef08a" text-anchor="end">فكرة الميزان الصرفي (الكفتان المتوازيتان)</text>

    <!-- Scale Illustration -->
    <g transform="translate(25, 45)">
      <!-- Central Pillar of Scale -->
      <polygon points="190,40 186,160 194,160" fill="#94a3b8"/>
      <rect x="160" y="155" width="60" height="12" rx="4" fill="#64748b"/>
      <circle cx="190" cy="38" r="7" fill="#f59e0b"/>

      <!-- Beam (Horizontal) -->
      <rect x="50" y="35" width="280" height="6" rx="3" fill="url(#goldBeam)"/>
      
      <!-- Left Pan (الموزون: الفعل المقيس) -->
      <line x1="75" y1="41" x2="55" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="75" y1="41" x2="95" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 45 90 Q 75 105 105 90 Z" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="42" y="105" width="66" height="24" rx="4" fill="#1e3a8a"/>
      <text x="75" y="121" class="word-bold" font-size="12" fill="#bfdbfe" text-anchor="middle">الموزون</text>

      <!-- Right Pan (الميزان الصرفي: فـ عـ ل) -->
      <line x1="305" y1="41" x2="285" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="305" y1="41" x2="325" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 275 90 Q 305 105 335 90 Z" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5"/>
      <rect x="272" y="105" width="66" height="24" rx="4" fill="#065f46"/>
      <text x="305" y="121" class="word-bold" font-size="12" fill="#a7f3d0" text-anchor="middle">الميزان</text>

      <!-- The Core Letters of FA-ALA -->
      <g transform="translate(15, 140)">
        <rect width="350" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        
        <!-- Faa -->
        <rect x="235" y="12" width="100" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="285" y="44" class="ar-title" font-size="24" fill="#38bdf8" text-anchor="middle">فَـ</text>
        <text x="285" y="68" class="body-ar" font-size="12" fill="#93c5fd" text-anchor="middle">فاء الفعل (الأول)</text>

        <!-- Ain -->
        <rect x="125" y="12" width="100" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="175" y="44" class="ar-title" font-size="24" fill="#10b981" text-anchor="middle">ـعَـ</text>
        <text x="175" y="68" class="body-ar" font-size="12" fill="#a7f3d0" text-anchor="middle">عين الفعل (الثاني)</text>

        <!-- Lam -->
        <rect x="15" y="12" width="100" height="72" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
        <text x="65" y="44" class="ar-title" font-size="24" fill="#ec4899" text-anchor="middle">ـلَ</text>
        <text x="65" y="68" class="body-ar" font-size="12" fill="#fbcfe8" text-anchor="middle">لام الفعل (الثالث)</text>
      </g>

      <!-- Rule of Addition & Deletion Box -->
      <g transform="translate(15, 252)">
        <rect width="350" height="195" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="335" y="26" class="ar-title" font-size="14" fill="#fbbf24">قواعد الموازنة وضبط الحركات:</text>

        <!-- Rule 1: Diacritics -->
        <circle cx="330" cy="46" r="3" fill="#38bdf8"/>
        <text x="320" y="50" class="body-ar" font-size="12" fill="#cbd5e1">1. يُنقل التشكيل كما هو تماماً:</text>
        <text x="320" y="68" class="word-bold" font-size="13" fill="#7dd3fc">كَتَبَ ⟸ فَعَلَ  |  حَسُنَ ⟸ فَعُلَ  |  عَلِمَ ⟸ فَعِلَ</text>

        <!-- Rule 2: Increment -->
        <circle cx="330" cy="94" r="3" fill="#10b981"/>
        <text x="320" y="98" class="body-ar" font-size="12" fill="#cbd5e1">2. ما يُزاد في الكلمة يُزاد بنصه في الميزان:</text>
        <text x="320" y="116" class="word-bold" font-size="13" fill="#6ee7b7">انْتَصَرَ (أصلها نصر) ⟸ افْتَعَلَ (زيادة الألف والتاء)</text>

        <!-- Rule 3: Deletion -->
        <circle cx="330" cy="142" r="3" fill="#ef4444"/>
        <text x="320" y="146" class="body-ar" font-size="12" fill="#cbd5e1">3. ما يُحذف من الأصل يُحذف مقابله في الميزان:</text>
        <text x="320" y="164" class="word-bold" font-size="13" fill="#fca5a5">قُلْ (أصلها قال/فعل) ⟸ فُلْ (حُذفت العين)</text>
        <text x="320" y="182" class="word-bold" font-size="13" fill="#fca5a5">قِ (أصلها وَقَى/فَعَلَ) ⟸ عِ (حُذفت الفاء واللام)</text>
      </g>
    </g>
  </g>

  <!-- Right Column: المجرد والمزيد وحروف الزيادة -->

  <!-- Panel 2: الفعل المجرد والمزيد وأوزانها -->
  <g transform="translate(490, 102)" filter="url(#arabShadow)">
    <rect width="450" height="260" rx="14" fill="url(#cardGradArab)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 436 0 Q 450 0 450 14 L 450 36 L 0 36 Z" fill="#0284c7" fill-opacity="0.3"/>
    
    <circle cx="428" cy="18" r="8" fill="#38bdf8"/>
    <text x="428" y="23" class="ar-title" font-size="11" fill="#fff" text-anchor="middle">2</text>
    <text x="410" y="24" class="card-head" fill="#7dd3fc" text-anchor="end">تقسيم الفعل إلى: مجرد ومزيد</text>

    <g transform="translate(20, 48)">
      <!-- Mujarrad Section -->
      <rect width="410" height="92" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="315" y="8" width="85" height="22" rx="4" fill="#0369a1"/>
      <text x="357" y="23" class="badge-txt" fill="#e0f2fe" text-anchor="middle">الفعل المجرد</text>
      <text x="300" y="23" class="body-ar" font-size="12" fill="#94a3b8">كل حروفه أصلية لا يمكن حذف أي منها</text>

      <g transform="translate(15, 38)">
        <rect width="185" height="44" rx="6" fill="#1e293b"/>
        <text x="175" y="20" class="word-bold" font-size="12" fill="#38bdf8">1) مجرد ثلاثي (فَعَلَ):</text>
        <text x="175" y="36" class="body-ar" font-size="12" fill="#cbd5e1">كَتَبَ ، جَلَسَ ، قَرَأَ ، شَرِبَ</text>

        <rect x="195" y="0" width="185" height="44" rx="6" fill="#1e293b"/>
        <text x="370" y="20" class="word-bold" font-size="12" fill="#38bdf8">2) مجرد رباعي (فَعْلَلَ):</text>
        <text x="370" y="36" class="body-ar" font-size="12" fill="#cbd5e1">دَحْرَجَ ، زَلْزَلَ ، بَعْثَرَ ، طَمْأَنَ</text>
      </g>

      <!-- Mazeed Section -->
      <g transform="translate(0, 102)">
        <rect width="410" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="315" y="8" width="85" height="22" rx="4" fill="#059669"/>
        <text x="357" y="23" class="badge-txt" fill="#d1fae5" text-anchor="middle">الفعل المزيد</text>
        <text x="300" y="23" class="body-ar" font-size="12" fill="#94a3b8">ما زاد على حروفه الأصلية حرف أو اثنان أو ثلاثة</text>

        <g transform="translate(15, 36)">
          <text x="380" y="18" class="body-ar" font-size="12" fill="#6ee7b7">▪ مزيد بحرف: أَكْرَمَ (أَفْعَلَ)، قَاتَلَ (فَاعَلَ)، عَلَّمَ (فَعَّلَ)</text>
          <text x="380" y="36" class="body-ar" font-size="12" fill="#6ee7b7">▪ مزيد بحرفين: انْكَسَرَ (انْفَعَلَ)، اشْتَرَكَ (افْتَعَلَ)، تَعَلَّمَ (تَفَعَّلَ)</text>
          <text x="380" y="54" class="body-ar" font-size="12" fill="#6ee7b7">▪ مزيد بثلاثة: اسْتَغْفَرَ (اسْتَفْعَلَ)، اسْتَخْرَجَ (اسْتَفْعَلَ)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Panel 3: حروف الزيادة وقواعد الكشف في المعجم -->
  <g transform="translate(490, 376)" filter="url(#arabShadow)">
    <rect width="450" height="240" rx="14" fill="url(#cardGradArab)" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 436 0 Q 450 0 450 14 L 450 36 L 0 36 Z" fill="#047857" fill-opacity="0.3"/>
    
    <circle cx="428" cy="18" r="8" fill="#10b981"/>
    <text x="428" y="23" class="ar-title" font-size="11" fill="#fff" text-anchor="middle">3</text>
    <text x="410" y="24" class="card-head" fill="#a7f3d0" text-anchor="end">حروف الزيادة وكيفية وزن الكلمات والكشف عنها</text>

    <g transform="translate(20, 48)">
      <!-- Letters of Increase Box -->
      <rect width="410" height="56" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="390" y="24" class="body-ar" font-size="12" fill="#a7f3d0">حروف الزيادة عشرة جُمعت في كلمة:</text>
      <text x="205" y="45" class="ar-title" font-size="18" fill="#facc15" text-anchor="middle">" سَـــأَلْـــتُـــمُـــونِـــيـــهَـــا "  أو  " هَـــنَـــاءٌ وَتَـــسْـــلِـــيـــمٌ "</text>

      <!-- Steps to find root -->
      <g transform="translate(0, 68)">
        <rect width="410" height="108" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="390" y="22" class="word-bold" font-size="13" fill="#fbbf24">خطوات وزن أي كلمة أو الكشف عنها في المعجم:</text>

        <circle cx="395" cy="40" r="3" fill="#38bdf8"/>
        <text x="385" y="44" class="body-ar" font-size="12" fill="#cbd5e1">1) تجريد الكلمة من الضمائر، ال التعريف، وتاء التأنيث (مُدَرِّسُون ⟵ دَرَسَ).</text>

        <circle cx="395" cy="64" r="3" fill="#38bdf8"/>
        <text x="385" y="68" class="body-ar" font-size="12" fill="#cbd5e1">2) الإتيان بالماضي المجرد لمعرفة الأصل (يَسْتَمِعُونَ ⟵ سَمِعَ ⟵ فَعَلَ).</text>

        <circle cx="395" cy="88" r="3" fill="#38bdf8"/>
        <text x="385" y="92" class="body-ar" font-size="12" fill="#cbd5e1">3) رد المحذوف وفك التضعيف إن وُجد (مَدَّ ⟵ مَدَدَ ، صِلَة ⟵ وَصَلَ).</text>
      </g>
    </g>
  </g>
</svg>
