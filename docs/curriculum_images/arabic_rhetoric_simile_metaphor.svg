<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="rhetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#190e28" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="goldHeading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="620" rx="16" fill="url(#rhetBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Main Title Bar -->
  <rect x="25" y="16" width="870" height="52" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <circle cx="50" cy="42" r="14" fill="#f59e0b" />
  <text x="50" y="47" text-anchor="middle" fill="#0f172a" font-family="'Cairo', 'Segoe UI', system-ui" font-size="14" font-weight="bold">٢</text>
  <text x="80" y="48" fill="#f8fafc" font-family="'Cairo', 'Segoe UI', system-ui" font-size="18" font-weight="bold">علم البيان في البلاغة العربية: أركان التشبيه وأنواعه والاستعارة وأسرار الجمال</text>
  <rect x="730" y="27" width="150" height="30" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8" />
  <text x="805" y="47" text-anchor="middle" fill="#fef08a" font-family="'Cairo', 'Segoe UI', system-ui" font-size="13" font-weight="600">البلاغة - الصف الأول الثانوي</text>

  <!-- Panel 1: Simile Taxonomy & Pillars (Top Left) -->
  <g transform="translate(25, 78)">
    <rect width="425" height="260" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <rect x="15" y="12" width="395" height="30" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" />
    <text x="212" y="32" text-anchor="middle" fill="#60a5fa" font-family="'Cairo', 'Segoe UI', system-ui" font-size="14" font-weight="bold">١. أركان التشبيه الأربعة وأنواعه المفردة</text>

    <!-- The 4 Pillars Row -->
    <g transform="translate(15, 48)">
      <rect width="395" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
      <!-- Pillar 1 -->
      <rect x="6" y="6" width="90" height="30" rx="4" fill="#1e3a8a" />
      <text x="51" y="25" text-anchor="middle" fill="#93c5fd" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">المُشَبَّه (١)</text>
      <!-- Pillar 2 -->
      <rect x="103" y="6" width="90" height="30" rx="4" fill="#1e3a8a" />
      <text x="148" y="25" text-anchor="middle" fill="#93c5fd" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">المُشَبَّه به (٢)</text>
      <!-- Pillar 3 -->
      <rect x="200" y="6" width="90" height="30" rx="4" fill="#312e81" />
      <text x="245" y="25" text-anchor="middle" fill="#c7d2fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">أداة التشبيه (٣)</text>
      <!-- Pillar 4 -->
      <rect x="298" y="6" width="90" height="30" rx="4" fill="#312e81" />
      <text x="343" y="25" text-anchor="middle" fill="#c7d2fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">وجه الشَّبَه (٤)</text>
    </g>

    <!-- 4 Types of Simile List -->
    <g transform="translate(15, 96)">
      <!-- Detailed -->
      <rect y="4" width="395" height="32" rx="5" fill="#0b1329" stroke="#1e293b" />
      <text x="15" y="24" fill="#38bdf8" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11.5" font-weight="bold">▪ تشبيه مُفَصَّل:</text>
      <text x="105" y="24" fill="#e2e8f0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11">ذُكرت فيه الأركان الأربعة (مثال: "الجنديُّ كالأسدِ في الشجاعةِ")</text>

      <!-- Concise -->
      <rect y="40" width="395" height="32" rx="5" fill="#0b1329" stroke="#1e293b" />
      <text x="15" y="60" fill="#a78bfa" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11.5" font-weight="bold">▪ تشبيه مُجْمَل:</text>
      <text x="105" y="60" fill="#e2e8f0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11">حُذِف منه وجه الشَّبه (مثال: "الجنديُّ كـالأسدِ")</text>

      <!-- Emphatic -->
      <rect y="76" width="395" height="32" rx="5" fill="#0b1329" stroke="#1e293b" />
      <text x="15" y="96" fill="#34d399" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11.5" font-weight="bold">▪ تشبيه مُؤَكَّد:</text>
      <text x="105" y="96" fill="#e2e8f0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11">حُذِفت منه أداة التشبيه (مثال: "الجنديُّ أسدٌ في الشجاعةِ")</text>

      <!-- Baleegh -->
      <rect y="112" width="395" height="38" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="135" fill="#fbbf24" font-family="'Cairo', 'Segoe UI', system-ui" font-size="12" font-weight="bold">▪ تشبيه بَلِيغ (الأعلى):</text>
      <text x="135" y="135" fill="#fef3c7" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">حُذفت الأداة ووجه الشبه معاً: "العلمُ نورٌ" / "الجهلُ ظلامٌ"</text>
    </g>
  </g>

  <!-- Panel 2: Metaphor Rules (Top Right) -->
  <g transform="translate(470, 78)">
    <rect width="425" height="260" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <rect x="15" y="12" width="395" height="30" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="0.8" />
    <text x="212" y="32" text-anchor="middle" fill="#f472b6" font-family="'Cairo', 'Segoe UI', system-ui" font-size="14" font-weight="bold">٢. الاستعارة (تشبيه بليغ حُذف أحد طرفيه)</text>

    <!-- Implicit Metaphor Box -->
    <g transform="translate(15, 52)">
      <rect width="395" height="90" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <rect x="12" y="8" width="160" height="22" rx="4" fill="#312e81" />
      <text x="92" y="23" text-anchor="middle" fill="#c7d2fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11.5" font-weight="bold">الاستعارة المكنية (حُذف المشبه به)</text>

      <text x="15" y="48" fill="#e2e8f0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11">▪ القاعدة: يُذكر المشبه ويُحذف المشبه به ويُرمز له بصفة من لوازمه.</text>
      <rect x="15" y="58" width="365" height="24" rx="4" fill="#0f172a" />
      <text x="197" y="74" text-anchor="middle" fill="#a5b4fc" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">مثال: "زأرَ الجنديُّ في وجهِ الأعداءِ" (شبّه الجندي بأسد وحذف الأسد وأبقى الزئير)</text>
    </g>

    <!-- Explicit Metaphor Box -->
    <g transform="translate(15, 150)">
      <rect width="395" height="92" rx="8" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
      <rect x="12" y="8" width="160" height="22" rx="4" fill="#881337" />
      <text x="92" y="23" text-anchor="middle" fill="#fecdd3" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11.5" font-weight="bold">الاستعارة التصريحية (صُرِّح بالمشبه به)</text>

      <text x="15" y="48" fill="#e2e8f0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11">▪ القاعدة: يُحذف المشبه ويُصرَّح بلفظ المشبه به مباشرة في السياق.</text>
      <rect x="15" y="58" width="365" height="24" rx="4" fill="#0f172a" />
      <text x="197" y="74" text-anchor="middle" fill="#fda4af" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">مثال: "واعتصموا بحبلِ اللهِ" (شبّه الدين بحبل وثيق وحذف المشبه وصرح بالمشبه به)</text>
    </g>
  </g>

  <!-- Panel 3: Aesthetic Secrets (Bottom Full-Width) -->
  <g transform="translate(25, 350)">
    <rect width="870" height="205" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <rect x="15" y="10" width="840" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
    <text x="435" y="29" text-anchor="middle" fill="#34d399" font-family="'Cairo', 'Segoe UI', system-ui" font-size="14" font-weight="bold">٣. أسرار جمال التشبيه والاستعارة (التشخيص والتجسيم والتوضيح)</text>

    <!-- 3 Pillars of Aesthetics -->
    <g transform="translate(20, 48)">
      <!-- Pillar 1: Personification -->
      <rect x="0" y="0" width="265" height="142" rx="8" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1" />
      <rect x="12" y="10" width="120" height="24" rx="4" fill="#0284c7" />
      <text x="72" y="26" text-anchor="middle" fill="#ffffff" font-family="'Cairo', 'Segoe UI', system-ui" font-size="12" font-weight="bold">١. التَّشْخِيص</text>
      <text x="15" y="54" fill="#bae6fd" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">المعنى: منح غير العاقل صفة إنسان</text>
      <text x="15" y="72" fill="#e0f2fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="10.5">▪ المعادلة: (معنوي أو جماد ⟵ إنسان)</text>
      <rect x="10" y="86" width="245" height="42" rx="5" fill="#0f172a" />
      <text x="132" y="104" text-anchor="middle" fill="#38bdf8" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">مثال: "شاكٍ إلى البحرِ اضطرابَ خواطري"</text>
      <text x="132" y="120" text-anchor="middle" fill="#94a3b8" font-family="'Cairo', 'Segoe UI', system-ui" font-size="9.5">جعل البحر إنساناً يُشكى إليه ويسمع</text>

      <!-- Pillar 2: Embodiment -->
      <rect x="282" y="0" width="265" height="142" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
      <rect x="294" y="10" width="120" height="24" rx="4" fill="#7c3aed" />
      <text x="354" y="26" text-anchor="middle" fill="#ffffff" font-family="'Cairo', 'Segoe UI', system-ui" font-size="12" font-weight="bold">٢. التَّجْسِيم</text>
      <text x="297" y="54" fill="#d8b4fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">المعنى: تحويل المعنوي إلى شيء مادي</text>
      <text x="297" y="72" fill="#ede9fe" font-family="'Cairo', 'Segoe UI', system-ui" font-size="10.5">▪ المعادلة: (أمر معنوي ⟵ مجسم ملموس)</text>
      <rect x="292" y="86" width="245" height="42" rx="5" fill="#0f172a" />
      <text x="414" y="104" text-anchor="middle" fill="#c084fc" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">مثال: "الصَّبْرُ مِفْتَاحُ الفَرَجِ"</text>
      <text x="414" y="120" text-anchor="middle" fill="#94a3b8" font-family="'Cairo', 'Segoe UI', system-ui" font-size="9.5">جسّد الصبر المعنوي في صورة مفتاح حديدي</text>

      <!-- Pillar 3: Clarification -->
      <rect x="565" y="0" width="265" height="142" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <rect x="577" y="10" width="120" height="24" rx="4" fill="#059669" />
      <text x="637" y="26" text-anchor="middle" fill="#ffffff" font-family="'Cairo', 'Segoe UI', system-ui" font-size="12" font-weight="bold">٣. التَّوْضِيح</text>
      <text x="580" y="54" fill="#a7f3d0" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">المعنى: رسم صورة مطابقة لتأكيد الفكرة</text>
      <text x="580" y="72" fill="#d1fae5" font-family="'Cairo', 'Segoe UI', system-ui" font-size="10.5">▪ المعادلة: (مادي ⟵ مادي) أو (معنوي ⟵ معنوي)</text>
      <rect x="575" y="86" width="245" height="42" rx="5" fill="#0f172a" />
      <text x="697" y="104" text-anchor="middle" fill="#34d399" font-family="'Cairo', 'Segoe UI', system-ui" font-size="11" font-weight="bold">مثال: "الجنديُّ كالأسدِ" / "العدلُ كالحقِّ"</text>
      <text x="697" y="120" text-anchor="middle" fill="#94a3b8" font-family="'Cairo', 'Segoe UI', system-ui" font-size="9.5">توضيح المعنى وتقريبه لذهن السامع والقارئ</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(25, 566)">
    <rect width="870" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="435" y="24" text-anchor="middle" fill="#fef08a" font-family="'Cairo', 'Segoe UI', system-ui" font-size="12.5" font-weight="bold">خلاصة البيان: التشبيه البليغ = مشبه + مشبه به  |  الاستعارة = تشبيه بليغ حُذف أحد طرفيه  |  المكنية: حُذف المشبه به  |  التصريحية: صُرّح بالمشبه به</text>
  </g>
</svg>
