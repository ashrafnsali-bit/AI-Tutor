<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#051f18"/>
      <stop offset="50%" stopColor="#064e3b"/>
      <stop offset="100%" stopColor="#022c22"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80"/>
      <stop offset="40%" stopColor="#22c55e"/>
      <stop offset="80%" stopColor="#16a34a"/>
      <stop offset="100%" stopColor="#15803d"/>
    </linearGradient>

    <radialGradient id="sunShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="60%" stopColor="#facc15"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </radialGradient>

    <marker id="arrowPhotoIn" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPhotoOut" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#facc15"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="460" rx="20" fill="url(#photoBg)" stroke="#047857" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="30" y="20" width="820" height="50" rx="12" fill="rgba(6, 78, 59, 0.85)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
  <text x="440" y="44" text-anchor="middle" fill="#34d399" font-size="19" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
    مخطط عملية البناء الضوئي في ورقة النبات (Photosynthesis in Plant Leaves)
  </text>
  <text x="440" y="62" text-anchor="middle" fill="#a7f3d0" font-size="12" font-family="system-ui, -apple-system, sans-serif">
    تحويل الطاقة الضوئية إلى طاقة كيميائية مخزنة في سكر الجلوكوز مع إطلاق الأكسجين
  </text>

  <!-- Sun Graphic -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="40" fill="url(#sunShine)"/>
    <text x="0" y="5" text-anchor="middle" fill="#78350f" font-size="14" font-weight="bold">الشمس</text>
    <text x="0" y="20" text-anchor="middle" fill="#78350f" font-size="10" font-weight="bold">ضوء وطاقة</text>
  </g>

  <!-- Solar Light Rays Arrow into Leaf -->
  <path d="M175,130 Q270,140 330,170" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="6,3" marker-end="url(#arrowPhotoOut)"/>
  <rect x="200" y="100" width="130" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#facc15" stroke-width="1"/>
  <text x="265" y="119" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">☀️ طاقة ضوء الشمس</text>

  <!-- CENTRAL LEAF GRAPHIC -->
  <g transform="translate(340, 100)">
    <!-- Leaf Body -->
    <path d="M30,160 C60,40 180,20 280,70 C310,140 280,230 140,240 C60,240 30,190 30,160 Z" fill="url(#leafGrad)" stroke="#86efac" stroke-width="3"/>
    <!-- Leaf Primary Vein -->
    <path d="M30,160 C110,150 190,120 280,70" fill="none" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    <!-- Secondary Veins -->
    <path d="M90,155 Q130,120 160,95 M150,140 Q190,110 220,90 M210,120 Q240,105 260,85" fill="none" stroke="#86efac" stroke-width="2.5"/>
    <path d="M90,155 Q110,190 140,210 M150,140 Q170,180 200,195 M210,120 Q230,150 250,165" fill="none" stroke="#86efac" stroke-width="2.5"/>

    <!-- Chloroplast Zoom Bubble -->
    <circle cx="160" cy="150" r="38" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <ellipse cx="160" cy="150" rx="30" ry="18" fill="#047857" stroke="#6ee7b7" stroke-width="1.5"/>
    <!-- Thylakoid Stacks -->
    <rect x="145" y="142" width="12" height="4" rx="2" fill="#86efac"/>
    <rect x="145" y="148" width="12" height="4" rx="2" fill="#86efac"/>
    <rect x="145" y="154" width="12" height="4" rx="2" fill="#86efac"/>
    <rect x="165" y="142" width="12" height="4" rx="2" fill="#86efac"/>
    <rect x="165" y="148" width="12" height="4" rx="2" fill="#86efac"/>
    <rect x="165" y="154" width="12" height="4" rx="2" fill="#86efac"/>
    <text x="160" y="180" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="bold">بلاستيدة خضراء</text>
  </g>

  <!-- INPUT 1: CO2 (ثاني أكسيد الكربون) -->
  <g transform="translate(140, 240)">
    <rect width="165" height="46" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="82" y="20" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">ثاني أكسيد الكربون (CO₂)</text>
    <text x="82" y="37" text-anchor="middle" fill="#e2e8f0" font-size="11">يدخل عبر ثغور الأوراق (Stomata)</text>
    <path d="M170,23 L220,23" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowPhotoIn)"/>
  </g>

  <!-- INPUT 2: H2O (الماء والأملاح من الجذور) -->
  <g transform="translate(140, 310)">
    <rect width="165" height="46" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="82" y="20" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">الماء والمعادن (H₂O)</text>
    <text x="82" y="37" text-anchor="middle" fill="#e2e8f0" font-size="11">تمتصه الجذور ويصعد بالساق</text>
    <path d="M170,23 L230,0" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowPhotoIn)"/>
  </g>

  <!-- OUTPUT 1: Glucose Sugar (سكر الجلوكوز) -->
  <g transform="translate(640, 160)">
    <path d="M-30,23 L-5,23" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arrowPhotoOut)"/>
    <rect width="185" height="52" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#facc15" stroke-width="2"/>
    <text x="92" y="22" text-anchor="middle" fill="#fde047" font-size="13" font-weight="bold">🍯 سكر الجلوكوز (C₆H₁₂O₆)</text>
    <text x="92" y="42" text-anchor="middle" fill="#fef08a" font-size="11">غذاء النبات ومصدر طاقة النمو</text>
  </g>

  <!-- OUTPUT 2: Oxygen Gas (غاز الأكسجين) -->
  <g transform="translate(640, 240)">
    <path d="M-30,23 L-5,23" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowPhotoOut)"/>
    <rect width="185" height="52" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#34d399" stroke-width="2"/>
    <text x="92" y="22" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">💨 غاز الأكسجين (O₂)</text>
    <text x="92" y="42" text-anchor="middle" fill="#a7f3d0" font-size="11">ينطلق في الهواء لتتنفسه الكائنات</text>
  </g>

  <!-- BOTTOM: CHEMICAL EQUATION BADGE -->
  <g transform="translate(80, 385)">
    <rect width="720" height="55" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">
      معادلة البناء الضوئي: ماء (H₂O) + ثاني أكسيد الكربون (CO₂) + ضوء الشمس ➔ سكر الجلوكوز (غذاء) + أكسجين (O₂)
    </text>
    <text x="360" y="44" text-anchor="middle" fill="#facc15" font-size="12" font-family="monospace" font-weight="bold">
      6 CO₂ + 6 H₂O + Light Energy ──(Chlorophyll)──&gt; C₆H₁₂O₆ + 6 O₂
    </text>
  </g>
</svg>
