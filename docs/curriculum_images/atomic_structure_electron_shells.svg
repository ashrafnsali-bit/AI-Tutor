<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="atomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#1a102f"/>
    </linearGradient>
    <radialGradient id="nucGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .sec-title { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
    .shell-tag { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; fill: #facc15; }
    .text-body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .tbl-hdr { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; font-weight: bold; fill: #93c5fd; text-anchor: middle; }
    .tbl-val { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 11.5px; fill: #f8fafc; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="url(#atomBg)"/>
  <rect x="8" y="8" width="944" height="624" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="25" y="18" width="910" height="62" rx="10" fill="#132338" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="480" y="44" class="title-main">مخطط التركيب الذري المعتمد ومستويات الطاقة الرئيسية وقواعد التوزيع الإلكتروني</text>
  <text x="480" y="66" class="subtitle">الكيمياء والعلوم • النواة المركزية (البروتونات والنيوترونات)، المستويات K,L,M,N، وقاعدة باولي وبور 2n²</text>

  <!-- Left: Visual Atom Shells Diagram -->
  <g transform="translate(25, 92)">
    <rect width="460" height="525" rx="12" fill="#0c1728" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="230" y="26" class="sec-title">١. مدارات مستويات الطاقة المحيطة بالنواة</text>

    <!-- Concentric Shells centered at (230, 270) -->
    <g transform="translate(230, 270)">
      <!-- Shell 4: N (r=180) -->
      <circle cx="0" cy="0" r="185" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Shell 3: M (r=140) -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Shell 2: L (r=95) -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Shell 1: K (r=55) -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="#38bdf8" stroke-width="2"/>

      <!-- Nucleus -->
      <circle cx="0" cy="0" r="26" fill="url(#nucGlow)" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="0" y="-4" font-family="'Cairo', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">النواة</text>
      <text x="0" y="10" font-family="'Cairo', sans-serif" font-size="8" fill="#fecaca" text-anchor="middle">p⁺ + n⁰</text>

      <!-- Electrons on K Shell (2 electrons) -->
      <circle cx="55" cy="0" r="5" fill="#38bdf8"/>
      <circle cx="-55" cy="0" r="5" fill="#38bdf8"/>

      <!-- Electrons on L Shell (8 electrons) -->
      <circle cx="0" cy="95" r="5" fill="#10b981"/>
      <circle cx="0" cy="-95" r="5" fill="#10b981"/>
      <circle cx="67" cy="67" r="5" fill="#10b981"/>
      <circle cx="-67" cy="-67" r="5" fill="#10b981"/>
      <circle cx="67" cy="-67" r="5" fill="#10b981"/>
      <circle cx="-67" cy="67" r="5" fill="#10b981"/>
      <circle cx="95" cy="0" r="5" fill="#10b981"/>
      <circle cx="-95" cy="0" r="5" fill="#10b981"/>

      <!-- Shell Labels -->
      <rect x="58" y="-14" width="48" height="18" rx="4" fill="#0284c7"/>
      <text x="82" y="-1" class="shell-tag" font-size="10" fill="#ffffff" text-anchor="middle">K (n=1)</text>

      <rect x="100" y="-14" width="48" height="18" rx="4" fill="#047857"/>
      <text x="124" y="-1" class="shell-tag" font-size="10" fill="#ffffff" text-anchor="middle">L (n=2)</text>

      <rect x="145" y="-14" width="48" height="18" rx="4" fill="#b45309"/>
      <text x="169" y="-1" class="shell-tag" font-size="10" fill="#ffffff" text-anchor="middle">M (n=3)</text>

      <rect x="188" y="-14" width="48" height="18" rx="4" fill="#7e22ce"/>
      <text x="212" y="-1" class="shell-tag" font-size="10" fill="#ffffff" text-anchor="middle">N (n=4)</text>
    </g>

    <!-- Legend bottom of left card -->
    <rect x="15" y="475" width="430" height="38" rx="6" fill="#132338" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="215" y="498" font-family="'Cairo', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">كلما ابتعدنا عن النواة: تزداد طاقة المستوى ويقل فرق الطاقة بين المستويات</text>
  </g>

  <!-- Right: Principles & Energy Level Capacity Table -->
  <g transform="translate(500, 92)">
    <rect width="435" height="525" rx="12" fill="#0c1728" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="217" y="26" class="sec-title">٢. سعة المستويات وقاعدة (2n²)</text>

    <!-- Formula Box -->
    <rect x="15" y="40" width="405" height="60" rx="8" fill="#132338" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="390" y="62" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">قاعدة عدد الإلكترونات الأقصى في المستوى:</text>
    <text x="202" y="88" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#facc15" text-anchor="middle">Number of Electrons = 2n²</text>

    <!-- Capacity Table -->
    <g transform="translate(15, 115)">
      <rect width="405" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <!-- Header -->
      <rect width="405" height="28" rx="8" fill="#1e293b"/>
      <text x="350" y="19" class="tbl-hdr">المستوى</text>
      <text x="260" y="19" class="tbl-hdr">الرقم (n)</text>
      <text x="160" y="19" class="tbl-hdr">تطبيق (2n²)</text>
      <text x="60" y="19" class="tbl-hdr">السعة القصوى</text>

      <!-- Row K -->
      <rect y="32" width="405" height="28" fill="#132338" opacity="0.6"/>
      <text x="350" y="50" class="tbl-val" font-weight="bold" fill="#38bdf8">K</text>
      <text x="260" y="50" class="tbl-val">1</text>
      <text x="160" y="50" class="tbl-val">2 × (1)²</text>
      <text x="60" y="50" class="tbl-val" font-weight="bold" fill="#38bdf8">2 إلكترون</text>

      <!-- Row L -->
      <rect y="64" width="405" height="28" fill="#0f172a" opacity="0.6"/>
      <text x="350" y="82" class="tbl-val" font-weight="bold" fill="#10b981">L</text>
      <text x="260" y="82" class="tbl-val">2</text>
      <text x="160" y="82" class="tbl-val">2 × (2)²</text>
      <text x="60" y="82" class="tbl-val" font-weight="bold" fill="#10b981">8 إلكترونات</text>

      <!-- Row M -->
      <rect y="96" width="405" height="28" fill="#132338" opacity="0.6"/>
      <text x="350" y="114" class="tbl-val" font-weight="bold" fill="#f59e0b">M</text>
      <text x="260" y="114" class="tbl-val">3</text>
      <text x="160" y="114" class="tbl-val">2 × (3)²</text>
      <text x="60" y="114" class="tbl-val" font-weight="bold" fill="#f59e0b">18 إلكتروناً</text>

      <!-- Row N -->
      <rect y="128" width="405" height="28" fill="#0f172a" opacity="0.6"/>
      <text x="350" y="146" class="tbl-val" font-weight="bold" fill="#a855f7">N</text>
      <text x="260" y="146" class="tbl-val">4</text>
      <text x="160" y="146" class="tbl-val">2 × (4)²</text>
      <text x="60" y="146" class="tbl-val" font-weight="bold" fill="#a855f7">32 إلكتروناً</text>
    </g>

    <!-- Subshells & Stability Rules -->
    <g transform="translate(15, 290)">
      <rect width="405" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="390" y="24" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="end">قواعد الاستقرار الكيميائي الجوهرية:</text>
      
      <text x="390" y="50" class="text-body" text-anchor="end">• <tspan fill="#facc15" font-weight="bold">قاعدة الثمانيات:</tspan> لا يتحمل مستوى الطاقة الخارجي لأي ذرة أكثر من ٨ إلكترونات مهما كان رقم المستوى (باستثناء K الذي يتشبع بـ 2).</text>
      
      <text x="390" y="90" class="text-body" text-anchor="end">• <tspan fill="#34d399" font-weight="bold">المستويات الفرعية (s, p, d, f):</tspan></text>
      <text x="390" y="112" class="text-body" text-anchor="end">  - المستوى s: أوربيتال واحد يتسع لـ ٢ إلكترون.</text>
      <text x="390" y="132" class="text-body" text-anchor="end">  - المستوى p: ٣ أوربيتالات تتسع لـ ٦ إلكترونات.</text>
      <text x="390" y="152" class="text-body" text-anchor="end">  - المستوى d: ٥ أوربيتالات تتسع لـ ١٠ إلكترونات.</text>
      <text x="390" y="172" class="text-body" text-anchor="end">  - المستوى f: ٧ أوربيتالات تتسع لـ ١٤ إلكتروناً.</text>

      <rect x="10" y="184" width="385" height="26" rx="4" fill="#1b120c" stroke="#b45309" stroke-width="0.8"/>
      <text x="202" y="201" font-family="'Cairo', sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">⚠️ لا تنطبق قاعدة (2n²) على المستويات الأعلى من الرابع حتى لا تصبح الذرة غير مستقرة</text>
    </g>
  </g>
</svg>
