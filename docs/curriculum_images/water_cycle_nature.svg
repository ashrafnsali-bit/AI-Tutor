<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0c4a6e"/>
      <stop offset="45%" stopColor="#0284c7"/>
      <stop offset="70%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0284c7"/>
      <stop offset="50%" stopColor="#0369a1"/>
      <stop offset="100%" stopColor="#075985"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#3f6212"/>
      <stop offset="25%" stopColor="#713f12"/>
      <stop offset="100%" stopColor="#451a03"/>
    </linearGradient>

    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f8fafc"/>
      <stop offset="20%" stopColor="#e2e8f0"/>
      <stop offset="50%" stopColor="#64748b"/>
      <stop offset="100%" stopColor="#334155"/>
    </linearGradient>

    <radialGradient id="sunRay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="70%" stopColor="#facc15"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </radialGradient>

    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M1,7 L4,1 L7,7 Z" fill="#facc15"/>
    </marker>
    <marker id="arrowRightBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowDownBlue" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M1,1 L7,1 L4,7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Sky Background -->
  <rect width="880" height="300" fill="url(#skyGrad)" rx="20"/>

  <!-- Sun -->
  <g transform="translate(130, 85)">
    <circle cx="0" cy="0" r="42" fill="url(#sunRay)"/>
    <text x="0" y="5" text-anchor="middle" fill="#78350f" font-size="14" font-weight="bold">الشمس</text>
    <text x="0" y="20" text-anchor="middle" fill="#78350f" font-size="9" font-weight="bold">طاقة حرارية</text>
  </g>

  <!-- Mountains -->
  <polygon points="620,300 740,110 860,300" fill="url(#mountainGrad)"/>
  <polygon points="740,110 705,160 725,155 740,165 755,155 775,160" fill="#f8fafc"/>

  <polygon points="490,300 590,140 700,300" fill="url(#mountainGrad)"/>
  <polygon points="590,140 565,180 580,175 590,185 605,175 620,180" fill="#f8fafc"/>

  <!-- Underground / Soil Layer -->
  <rect x="280" y="300" width="600" height="160" fill="url(#groundGrad)"/>
  
  <!-- Ocean / Water Body -->
  <rect x="0" y="270" width="360" height="190" fill="url(#oceanGrad)" rx="0"/>
  <path d="M0,270 Q60,265 120,270 T240,270 T360,270 L360,460 L0,460 Z" fill="url(#oceanGrad)"/>
  <text x="140" y="380" fill="#bae6fd" font-size="18" font-weight="bold">المحيط / البحر</text>
  <text x="140" y="405" fill="#e0f2fe" font-size="12">مياه مالحة (تغطي 71% من الأرض)</text>

  <!-- Underground Aquifer / Groundwater -->
  <rect x="420" y="375" width="410" height="65" rx="10" fill="rgba(14, 165, 233, 0.3)" stroke="#38bdf8" stroke-dasharray="4,3"/>
  <text x="625" y="405" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold">💧 المياه الجوفية (Groundwater)</text>
  <text x="625" y="425" text-anchor="middle" fill="#bae6fd" font-size="11">مياه عذبة نقية مخزنة في مسام الصخور والرمال</text>

  <!-- River / Surface Runoff -->
  <path d="M680,240 Q580,270 480,285 Q400,295 340,300" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
  <text x="490" y="275" fill="#f8fafc" font-size="13" font-weight="bold" transform="rotate(8 490 275)">النهر: جريان سطحي ➔</text>

  <!-- Clouds -->
  <!-- Cloud 1 (Evaporation area) -->
  <g transform="translate(300, 75)" fill="#f8fafc">
    <ellipse cx="40" cy="35" rx="35" ry="22"/>
    <ellipse cx="65" cy="25" rx="30" ry="22"/>
    <ellipse cx="90" cy="35" rx="25" ry="18"/>
  </g>
  <!-- Cloud 2 (Precipitation area over mountain) -->
  <g transform="translate(620, 60)" fill="#cbd5e1">
    <ellipse cx="45" cy="35" rx="40" ry="24"/>
    <ellipse cx="75" cy="25" rx="35" ry="25"/>
    <ellipse cx="105" cy="35" rx="30" ry="20"/>
  </g>

  <!-- Rain Drops from Cloud 2 -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <line x1="640" y1="95" x2="635" y2="115"/>
    <line x1="660" y1="100" x2="655" y2="120"/>
    <line x1="680" y1="95" x2="675" y2="115"/>
    <line x1="700" y1="100" x2="695" y2="120"/>
    <line x1="720" y1="95" x2="715" y2="115"/>
  </g>

  <!-- CYCLE ANNOTATIONS & ARROWS -->
  <!-- 1. Evaporation (التبخر) -->
  <path d="M210,240 C210,200 240,170 260,135" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowUp)"/>
  <rect x="155" y="180" width="105" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#facc15" stroke-width="1.5"/>
  <text x="207" y="196" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">١. التبخر</text>
  <text x="207" y="208" text-anchor="middle" fill="#ffffff" font-size="9">صعود بخار الماء</text>

  <!-- 2. Condensation (التكثف) -->
  <path d="M410,75 L590,75" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowRightBlue)"/>
  <rect x="445" y="45" width="115" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="502" y="61" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">٢. التكثف</text>
  <text x="502" y="73" text-anchor="middle" fill="#ffffff" font-size="9">تكون السحب والغيوم</text>

  <!-- 3. Precipitation (الهطول) -->
  <rect x="740" y="60" width="115" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="797" y="76" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">٣. الهطول</text>
  <text x="797" y="88" text-anchor="middle" fill="#ffffff" font-size="9">أمطار وثلوج 🌧️</text>

  <!-- 4. Infiltration (التسرب للمياه الجوفية) -->
  <path d="M720,290 L700,360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowDownBlue)"/>
  <rect x="705" y="325" width="100" height="26" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1"/>
  <text x="755" y="342" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="bold">٥. تسرب مائي</text>

  <!-- Header Banner -->
  <rect x="25" y="15" width="830" height="42" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <text x="440" y="38" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">
    دورة الماء في الطبيعة وحركة الموارد المائية (The Water Cycle in Nature)
  </text>
</svg>
